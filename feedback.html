<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1D1D1F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="/icons/36efd6fc09ed8400d86a61e92bd75897.jpg?v=4">
  <title>YeranFood · Feedback</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#F5F5F7;color:#1D1D1F;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    body{min-height:100vh;min-height:100svh;padding-bottom:calc(94px + env(safe-area-inset-bottom,0px))}
    header{padding:calc(24px + env(safe-area-inset-top,0px)) 18px 22px;background:#1D1D1F;color:#fff;text-align:center}
    header h1{margin:0;font-size:27px;letter-spacing:-.5px}
    header p{margin:7px 0 0;color:#C7C7CC;font-size:13px}
    .lang{display:flex;justify-content:center;gap:8px;margin-top:15px}
    .lang button{min-width:68px;padding:8px 14px;border:1px solid #555;border-radius:999px;background:#303034;color:#fff;font-size:13px}
    .lang button.active{background:#fff;color:#1D1D1F;border-color:#fff}
    main{width:min(100% - 32px,680px);margin:22px auto 30px}
    .intro{margin:0 2px 16px;color:#6E6E73;font-size:14px;line-height:1.55}
    .card{background:#fff;border:1px solid #E5E5EA;border-radius:17px;padding:20px;margin-bottom:15px;box-shadow:0 2px 10px rgba(0,0,0,.035)}
    h2{font-size:18px;margin:0 0 16px}
    label{display:block;margin:0 0 7px;font-size:13px;font-weight:650;color:#48484D}
    input,textarea{width:100%;border:1px solid #DADAE0;border-radius:11px;padding:13px 14px;font:inherit;font-size:15px;background:#fff;color:#1D1D1F;outline:none}
    input{margin-bottom:14px}
    textarea{min-height:132px;resize:vertical;line-height:1.55}
    input:focus,textarea:focus{border-color:#8E8E93;box-shadow:0 0 0 3px rgba(29,29,31,.08)}
    button{cursor:pointer}
    .submit{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:#1D1D1F;color:#fff;font-size:15px;font-weight:700}
    .submit:disabled{opacity:.55;cursor:wait}
    #formMsg{min-height:20px;margin-top:10px;text-align:center;font-size:13px;line-height:1.5}
    #feedbackList{display:grid;gap:11px}
    .feedback-item{padding:14px;border:1px solid #E9E9ED;border-radius:12px;background:#FAFAFB}
    .feedback-meta{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}
    .feedback-meta strong{font-size:14px}
    .feedback-meta time{font-size:12px;color:#8E8E93;white-space:nowrap}
    .feedback-content{font-size:14px;line-height:1.65;color:#48484D;white-space:pre-wrap;overflow-wrap:anywhere}
    .empty{padding:24px 8px;text-align:center;color:#8E8E93;font-size:14px}
    #bottomNav{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;justify-content:space-around;gap:8px;padding:8px 18px calc(8px + env(safe-area-inset-bottom,0px));min-height:72px;background:rgba(255,255,255,.98);border-top:1px solid #E9E9ED;box-shadow:0 -5px 24px rgba(29,29,31,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .navBtn{flex:1;min-width:0;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:4px 6px;border:0;border-radius:14px;background:transparent;color:#8A8A91;font-size:11px;font-weight:600;text-decoration:none}
    .navIcon{width:32px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:10px}
    .navIcon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .navBtn.active{color:#E8552F;font-weight:750}
    .navBtn.active .navIcon{background:#FFF0E9;color:#E8552F}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<header>
  <h1>YeranFood</h1>
  <p id="pageSubtitle">反馈与建议</p>
  <div class="lang"><button id="zhBtn" type="button">中文</button><button id="enBtn" type="button">English</button></div>
</header>
<main>
  <p class="intro" id="introText">你的意见能帮助我们持续改善菜单与服务。感谢你的支持。</p>
  <section class="card">
    <h2 id="formTitle">留下评价</h2>
    <form id="feedbackForm">
      <label id="nameLabel" for="fbName">姓名</label>
      <input id="fbName" maxlength="80" autocomplete="name" required placeholder="请输入姓名">
      <label id="contentLabel" for="fbContent">反馈内容</label>
      <textarea id="fbContent" maxlength="2000" required placeholder="写下你的建议或意见..."></textarea>
      <button class="submit" id="submitBtn" type="submit">提交反馈</button>
      <div id="formMsg" role="status" aria-live="polite"></div>
    </form>
  </section>
  <section class="card">
    <h2 id="listTitle">大家的反馈</h2>
    <div id="feedbackList"><div class="empty" id="loadingText">加载中…</div></div>
  </section>
</main>
<nav id="bottomNav" aria-label="Main navigation">
  <a class="navBtn" href="/"><span class="navIcon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg></span><span id="navOrder">点餐</span></a>
  <a class="navBtn" href="/orders.html"><span class="navIcon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3.5h8l4 4V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1zM15 3.5V8h4M9 12h6M9 16h6"/></svg></span><span id="navOrders">我的订单</span></a>
  <a class="navBtn active" href="/feedback.html" aria-current="page"><span class="navIcon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H7l-3 2v-5.2A7.5 7.5 0 1 1 20 11.5Z M8.5 11.5h7M8.5 14.5h4"/></svg></span><span id="navFeedback">反馈</span></a>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient=supabase.createClient('https://kbzspuxrwsuxoyozmvjb.supabase.co','sb_publishable_oC0S_vWgBt_X8N4Xu4cG4g_ekhGwKXB');
const translations={
 zh:{subtitle:'反馈与建议',intro:'你的意见能帮助我们持续改善菜单与服务。感谢你的支持。',form:'留下评价',name:'姓名',namePh:'请输入姓名',content:'反馈内容',contentPh:'写下你的建议或意见...',submit:'提交反馈',sending:'提交中…',sent:'✓ 已提交，谢谢你的反馈！审核通过后会公开显示。',required:'请填写姓名和反馈内容。',failed:'提交失败，请稍后重试。',list:'大家的反馈',loading:'加载中…',empty:'目前还没有公开的反馈。',loadFail:'反馈加载失败，请稍后重试。',order:'点餐',orders:'我的订单',feedback:'反馈'},
 en:{subtitle:'Feedback & Suggestions',intro:'Your feedback helps us improve our menu and service. Thank you for your support.',form:'Leave a Review',name:'Name',namePh:'Enter your name',content:'Your Feedback',contentPh:'Share your suggestions or comments...',submit:'Submit Feedback',sending:'Submitting…',sent:'✓ Submitted. Thank you! It will appear here after approval.',required:'Please enter your name and feedback.',failed:'Submission failed. Please try again later.',list:'Community Feedback',loading:'Loading…',empty:'There is no public feedback yet.',loadFail:'Could not load feedback. Please try again later.',order:'Order',orders:'My Orders',feedback:'Feedback'}
};
let lang=localStorage.getItem('lang')==='en'?'en':'zh';
function escapeHtml(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function applyLang(){
 const t=translations[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'en';
 const ids={pageSubtitle:'subtitle',introText:'intro',formTitle:'form',nameLabel:'name',contentLabel:'content',submitBtn:'submit',listTitle:'list',loadingText:'loading',navOrder:'order',navOrders:'orders',navFeedback:'feedback'};
 Object.entries(ids).forEach(([id,key])=>document.getElementById(id).textContent=t[key]);
 document.getElementById('fbName').placeholder=t.namePh;document.getElementById('fbContent').placeholder=t.contentPh;
 document.getElementById('zhBtn').classList.toggle('active',lang==='zh');document.getElementById('enBtn').classList.toggle('active',lang==='en');
}
document.getElementById('zhBtn').addEventListener('click',()=>{lang='zh';localStorage.setItem('lang',lang);applyLang();loadFeedback()});
document.getElementById('enBtn').addEventListener('click',()=>{lang='en';localStorage.setItem('lang',lang);applyLang();loadFeedback()});
document.getElementById('feedbackForm').addEventListener('submit',async e=>{
 e.preventDefault();const t=translations[lang],name=document.getElementById('fbName').value.trim(),content=document.getElementById('fbContent').value.trim(),msg=document.getElementById('formMsg'),btn=document.getElementById('submitBtn');
 if(!name||!content){msg.style.color='#C0392B';msg.textContent=t.required;return}
 btn.disabled=true;btn.textContent=t.sending;msg.textContent='';
 try{const {error}=await supabaseClient.from('feedback').insert({name,content,approved:false});if(error)throw error;
  msg.style.color='#248A52';msg.textContent=t.sent;e.target.reset();
 }catch(err){console.error('Feedback submission failed:',err);msg.style.color='#C0392B';msg.textContent=t.failed}
 finally{btn.disabled=false;btn.textContent=t.submit}
});
async function loadFeedback(){
 const list=document.getElementById('feedbackList'),t=translations[lang];list.innerHTML='<div class="empty">'+escapeHtml(t.loading)+'</div>';
 try{const {data,error}=await supabaseClient.from('feedback').select('name,content,created_at').eq('approved',true).order('created_at',{ascending:false});if(error)throw error;
  if(!data||!data.length){list.innerHTML='<div class="empty">'+escapeHtml(t.empty)+'</div>';return}
  list.innerHTML=data.map(item=>{let date='';if(item.created_at){const d=new Date(item.created_at);if(!isNaN(d.getTime()))date=d.toLocaleDateString(lang==='zh'?'zh-CN':'en-US',{year:'numeric',month:'short',day:'numeric'})}
   return '<article class="feedback-item"><div class="feedback-meta"><strong>'+escapeHtml(item.name)+'</strong><time>'+escapeHtml(date)+'</time></div><div class="feedback-content">'+escapeHtml(item.content)+'</div></article>'
  }).join('');
 }catch(err){console.error('Feedback loading failed:',err);list.innerHTML='<div class="empty">'+escapeHtml(t.loadFail)+'</div>'}
}
applyLang();loadFeedback();
</script>
</body>
</html>
