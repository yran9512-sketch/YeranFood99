<body>
<header>
  <h1 id="pageTitle">反馈</h1>
</header>
<main>
  <p class="intro" id="introText">你的意见能帮助我们持续改善菜单与服务。感谢你的支持。</p>
  <section class="card">
    <h2 id="formTitle">留下评价</h2>
    <form id="feedbackForm">
      <label id="nameLabel" for="fbName">姓名</label>
      <input id="fbName" maxlength="80" autocomplete="name" required placeholder="请输入姓名">
      <label id="contentLabel" for="fbContent">反馈内容</label>
      <textarea id="fbContent" maxlength="2000" required placeholder="写下你的建议或意见..."></textarea>
      <button class="submit" id="submitBtn" type="submit">提交反馈</button>
      <div id="formMsg" role="status" aria-live="polite"></div>
    </form>
  </section>
  <section class="card">
    <h2 id="listTitle">大家的反馈</h2>
    <div id="feedbackList"><div class="empty" id="loadingText">加载中…</div></div>
  </section>
</main>
<nav id="bottomNav" aria-label="Main navigation">
  <a class="navBtn" href="/"><span class="navIcon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg></span><span id="navOrder">点餐</span></a>
  <a class="navBtn" href="/orders.html"><span class="navIcon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3.5h8l4 4V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1zM15 3.5V8h4M9 12h6M9 16h6"/></svg></span><span id="navOrders">我的订单</span></a>
  <a class="navBtn active" href="/feedback.html" aria-current="page"><span class="navIcon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H7l-3 2v-5.2A7.5 7.5 0 1 1 20 11.5Z M8.5 11.5h7M8.5 14.5h4"/></svg></span><span id="navFeedback">反馈</span></a>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient=supabase.createClient('https://kbzspuxrwsuxoyozmvjb.supabase.co','sb_publishable_oC0S_vWgBt_X8N4Xu4cG4g_ekhGwKXB');
const translations={
 zh:{pageTitle:'反馈',intro:'你的意见能帮助我们持续改善菜单与服务。感谢你的支持。',form:'留下评价',name:'姓名',namePh:'请输入姓名',content:'反馈内容',contentPh:'写下你的建议或意见...',submit:'提交反馈',sending:'提交中…',sent:'✓ 已提交，谢谢你的反馈！审核通过后会公开显示。',required:'请填写姓名和反馈内容。',failed:'提交失败，请稍后重试。',list:'大家的反馈',loading:'加载中…',empty:'目前还没有公开的反馈。',loadFail:'反馈加载失败，请稍后重试。',order:'点餐',orders:'我的订单',feedback:'反馈'},
 en:{pageTitle:'Feedback',intro:'Your feedback helps us improve our menu and service. Thank you for your support.',form:'Leave a Review',name:'Name',namePh:'Enter your name',content:'Your Feedback',contentPh:'Share your suggestions or comments...',submit:'Submit Feedback',sending:'Submitting…',sent:'✓ Submitted. Thank you! It will appear here after approval.',required:'Please enter your name and feedback.',failed:'Submission failed. Please try again later.',list:'Community Feedback',loading:'Loading…',empty:'There is no public feedback yet.',loadFail:'Could not load feedback. Please try again later.',order:'Order',orders:'My Orders',feedback:'Feedback'}
};
let lang=localStorage.getItem('lang')==='en'?'en':'zh';
function escapeHtml(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function applyLang(){
 const t=translations[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'en';
 const ids={pageTitle:'pageTitle',introText:'intro',formTitle:'form',nameLabel:'name',contentLabel:'content',submitBtn:'submit',listTitle:'list',loadingText:'loading',navOrder:'order',navOrders:'orders',navFeedback:'feedback'};
 Object.entries(ids).forEach(([id,key])=>document.getElementById(id).textContent=t[key]);
 document.getElementById('fbName').placeholder=t.namePh;document.getElementById('fbContent').placeholder=t.contentPh;
}
document.getElementById('feedbackForm').addEventListener('submit',async e=>{
 e.preventDefault();const t=translations[lang],name=document.getElementById('fbName').value.trim(),content=document.getElementById('fbContent').value.trim(),msg=document.getElementById('formMsg'),btn=document.getElementById('submitBtn');
 if(!name||!content){msg.style.color='#C0392B';msg.textContent=t.required;return}
 btn.disabled=true;btn.textContent=t.sending;msg.textContent='';
 try{const {error}=await supabaseClient.from('feedback').insert({name,content,approved:false});if(error)throw error;
  msg.style.color='#248A52';msg.textContent=t.sent;e.target.reset();
 }catch(err){console.error('Feedback submission failed:',err);msg.style.color='#C0392B';msg.textContent=t.failed}
 finally{btn.disabled=false;btn.textContent=t.submit}
});
async function loadFeedback(){
 const list=document.getElementById('feedbackList'),t=translations[lang];list.innerHTML='<div class="empty">'+escapeHtml(t.loading)+'</div>';
 try{const {data,error}=await supabaseClient.from('feedback').select('name,content,created_at').eq('approved',true).order('created_at',{ascending:false});if(error)throw error;
  if(!data||!data.length){list.innerHTML='<div class="empty">'+escapeHtml(t.empty)+'</div>';return}
  list.innerHTML=data.map(item=>{let date='';if(item.created_at){const d=new Date(item.created_at);if(!isNaN(d.getTime()))date=d.toLocaleDateString(lang==='zh'?'zh-CN':'en-US',{year:'numeric',month:'short',day:'numeric'})}
   return '<article class="feedback-item"><div class="feedback-meta"><strong>'+escapeHtml(item.name)+'</strong><time>'+escapeHtml(date)+'</time></div><div class="feedback-content">'+escapeHtml(item.content)+'</div></article>'
  }).join('');
 }catch(err){console.error('Feedback loading failed:',err);list.innerHTML='<div class="empty">'+escapeHtml(t.loadFail)+'</div>'}
}
applyLang();loadFeedback();
</script>
<script id="yf-unified-nav-active-indicator">
(function(){
 function setup(){
  var nav=document.querySelector("#bottomNav");
  if(!nav)return;
  var buttons=Array.from(nav.querySelectorAll(".navBtn"));
  function update(){
   var index=buttons.findIndex(function(b){return b.classList.contains('active')||b.getAttribute('aria-current')==='page';});
   if(index<0)index=0;
   nav.style.setProperty('--yf-active-index',String(index));
  }
  update();
  new MutationObserver(update).observe(nav,{subtree:true,attributes:true,attributeFilter:['class','aria-current']});
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup,{once:true});else setup();
})();
</script>
</body>
