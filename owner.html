<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YeranFood · 管理员</title>
  <style>
    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f7f5f0;
      color: #222
    }

    header {
      background: #111;
      color: #fff;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px
    }

    header h1 {
      margin: 0;
      font-size: 20px
    }

    header button {
      background: transparent;
      color: #fff;
      border: 1px solid #777;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 14px
    }

    .container {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 16px
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px #0000000d
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 12px
    }

    button.primary {
      padding: 12px 24px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer
    }

    button.primary:hover {
      opacity: .85
    }

    button.small {
      padding: 6px 10px;
      border: 0;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600
    }

    button.green {
      background: #2e7d32;
      color: #fff
    }

    button.gray {
      background: #eee;
      color: #333
    }

    button.red {
      background: #c0392b;
      color: #fff
    }

    .summary {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px
    }

    .summary>div {
      flex: 1;
      min-width: 130px;
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      box-shadow: 0 3px 12px #0000000d
    }

    .summary .num {
      font-size: 26px;
      font-weight: 800;
      color: #111
    }

    .summary .lbl {
      font-size: 13px;
      color: #666;
      margin-top: 4px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 12px;
      overflow: hidden
    }

    th,
    td {
      padding: 10px 8px;
      text-align: left;
      border-bottom: 1px solid #eee;
      font-size: 13px
    }

    th {
      background: #fafafa;
      font-weight: 700;
      color: #555
    }

    td.note {
      color: #888;
      max-width: 140px
    }

    .tag {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700
    }

    .tag.meat {
      background: #ffe4e1;
      color: #c0392b
    }

    .tag.veg {
      background: #e8f5e9;
      color: #2e7d32
    }

    .tag.online {
      background: #e3f2fd;
      color: #1565c0
    }

    .tag.cash {
      background: #fff8e1;
      color: #ef6c00
    }

    .tag.paid {
      background: #e8f5e9;
      color: #2e7d32
    }

    .tag.unpaid {
      background: #ffebee;
      color: #c62828
    }

    .hidden {
      display: none
    }

    .err {
      color: #c0392b;
      margin-top: 10px
    }

    h2 {
      margin: 0 0 12px
    }

    .noorders {
      text-align: center;
      color: #999;
      padding: 40px
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0009;
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px
    }

    .modal.open {
      display: flex
    }

    .modal img {
      max-width: 100%;
      max-height: 90%;
      border-radius: 8px;
      background: #fff
    }

    .filter {
      margin-bottom: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap
    }

    .filter button {
      padding: 6px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-size: 13px
    }

    .filter button.active {
      background: #111;
      color: #fff;
      border-color: #111
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 3px 12px #0000000d;
      border: 1px solid #eee;
    }

    .stat-icon {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .stat-num {
      font-size: 28px;
      font-weight: 800;
      color: #111;
    }

    .stat-label {
      margin-top: 4px;
      font-size: 13px;
      color: #777;
    }

    .stat-card.warning {
      border-left: 4px solid #ef6c00;
    }

    .stat-card.success {
      border-left: 4px solid #2e7d32;
    }

    .stat-card.info {
      border-left: 4px solid #1565c0;
    }

    .stat-card.money {
      border-left: 4px solid #8e44ad;
    }

    @media (max-width: 700px) {
      .dashboard {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .stat-card {
        padding: 14px;
      }

      .stat-num {
        font-size: 23px;
      }
    }

    @media (max-width: 420px) {
      .dashboard {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 700px) {

        gap: 10px;
      }

      .stat-card {
        padding: 14px;
      }

      .stat-num {
        font-size: 23px;
      }
    }

    .order-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: flex-end;
      margin-bottom: 18px;
      padding: 14px;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 14px;
    }

    .filter-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filter-group>span {
      font-size: 13px;
      color: #777;
      margin-right: 2px;
    }

    .filter-btn,
    .refresh-btn {
      border: 1px solid #ddd;
      background: #fff;
      color: #333;
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 13px;
    }

    .filter-btn:hover,
    .refresh-btn:hover {
      background: #f2f2f2;
    }

    .filter-btn.active {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    .refresh-btn {
      margin-left: auto;
      font-weight: 600;
    }

    @media (max-width: 700px) {
      .order-filters {
        display: block;
      }

      .filter-group {
        margin-bottom: 10px;
      }

      .refresh-btn {
        margin-left: 0;
        width: 100%;
        margin-top: 4px;
      }
    }

    @media (max-width: 700px) {

      body {
        font-size: 14px;
      }

      header {
        padding: 14px 16px;
      }

      header h1 {
        font-size: 18px;
      }

      .container {
        padding: 12px;
      }

      .card {
        padding: 14px;
        border-radius: 14px;
      }

      .card h2 {
        font-size: 18px;
      }

      /* Dashboard */
      .dashboard {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .stat-card {
        min-width: 0;
        padding: 12px;
        border-radius: 12px;
      }

      .stat-icon {
        font-size: 20px;
        margin-bottom: 5px;
      }

      .stat-num {
        font-size: 21px;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }

      .stat-label {
        font-size: 12px;
      }

      /* 筛选器 */
      .order-filters {
        padding: 10px;
        border-radius: 12px;
      }

      .filter-group {
        gap: 5px;
      }

      .filter-group>span {
        width: 100%;
        margin-bottom: 2px;
      }

      .filter-btn {
        padding: 8px 11px;
        min-height: 36px;
      }

      .refresh-btn {
        min-height: 40px;
      }

      /* 订单表 */
      #ordersBox {
        margin-left: -2px;
        margin-right: -2px;
      }

      #ordersBox table {
        min-width: 850px;
        font-size: 13px;
      }

      #ordersBox th,
      #ordersBox td {
        padding: 9px 7px;
        white-space: nowrap;
      }

      /* 操作按钮 */
      #ordersBox button.small {
        min-height: 34px;
        padding: 6px 10px;
        margin: 2px 0;
      }

      /* 菜单编辑 */
      input,
      textarea,
      select {
        max-width: 100%;
        box-sizing: border-box;
      }

      /* 菜单选项 */
      #optionsBox {
        overflow-x: auto;
      }

      #optionsBox table {
        min-width: 800px;
      }

    }

    @media (max-width: 480px) {

      .filter-btn {
        flex: 1;
        min-width: 0;
        text-align: center;
      }

      .filter-group {
        width: 100%;
      }

      .filter-group>span {
        font-weight: 600;
        color: #555;
      }

      .stat-num {
        font-size: 19px;
      }

      .stat-label {
        white-space: nowrap;
      }

      #ordersBox button.small {
        width: auto;
        min-width: 72px;
      }

    }

    /* =========================
   Owner Menu Options
   ========================= */

    .options-mobile {
      display: none;
    }

    .option-card {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px #00000008;
    }

    .option-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .option-card-title {
      font-size: 16px;
      font-weight: 800;
    }

    .option-card-status {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .option-card-status.on {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .option-card-status.off {
      background: #ffebee;
      color: #c62828;
    }

    .option-field {
      margin-bottom: 10px;
    }

    .option-field label {
      display: block;
      font-size: 12px;
      color: #777;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .option-field input {
      margin: 0;
      padding: 9px 10px;
      font-size: 14px;
    }

    .option-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .option-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }

    .option-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .option-toggle input {
      width: 18px;
      height: 18px;
      margin: 0;
    }

    .option-delete {
      margin-left: auto;
    }

    @media (max-width: 700px) {

      #optionsBox>table {
        display: none;
      }

      .options-mobile {
        display: block;
      }

      .option-card {
        padding: 14px;
      }

      .option-row {
        grid-template-columns: 1fr 1fr;
      }

      .option-card input {
        width: 100%;
      }

      .option-delete {
        min-height: 36px;
        padding: 7px 14px;
      }
    }

    @media (max-width: 420px) {

      .option-row {
        grid-template-columns: 1fr;
      }

      .option-card-head {
        align-items: flex-start;
      }

    }

    .order-card-info {
      display: grid;

    }

    .order-card-item {

    }

    .order-card-item strong {

    .order-card-payment {

    .order-card-payment .paid {

    }

    .order-card-payment .unpaid {

    }

    }

    }

      }

      .order-card {
        padding: 14px;
      }
    }

    @media (max-width: 420px) {
      .order-card-info {
        grid-template-columns: 1fr;
      }

      .order-card-actions button {
        min-width: 100%;
      }

    /* ===== 2026 UI 优化：管理端 ===== */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 14px rgba(0,0,0,.08);
    }
    .container { width: min(100%, 1180px); }
    .card { border: 1px solid #eee; transition: box-shadow .18s ease; }
    .card:hover { box-shadow: 0 6px 20px rgba(0,0,0,.07); }
    .summary>div {
      border: 1px solid #eee;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .summary>div:hover { transform: translateY(-2px); }
    .filter {
      position: sticky;
      top: 70px;
      z-index: 20;
      padding: 10px;
      background: rgba(247,245,240,.94);
      backdrop-filter: blur(8px);
      border-radius: 12px;
    }
    .filter button {
      min-height: 38px;
      transition: all .15s ease;
    }
    .filter button:hover { border-color: #999; transform: translateY(-1px); }
    table { box-shadow: 0 2px 12px rgba(0,0,0,.04); }
    tbody tr:hover { background: #fafafa; }
    button { transition: transform .12s ease, opacity .12s ease; }
    button:active { transform: scale(.97); }
    .small { min-height: 32px; }
    @media (max-width:700px) {
      header { position: sticky; top: 0; }
      .container { padding: 0 10px; margin-top: 12px; }
      .card { padding: 16px; border-radius: 12px; }
      .summary { gap: 8px; }
      .summary>div { min-width: calc(50% - 8px); padding: 12px 8px; }
      .summary .num { font-size: 22px; }
      .filter { top: 58px; overflow-x: auto; flex-wrap: nowrap; }
      .filter button { flex: 0 0 auto; white-space: nowrap; }
    }

  
    /* ===== 全局 UI 稳定性增强 ===== */
    button, input, textarea, select { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid rgba(26,115,232,.28);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
    @media (max-width: 700px) {
      button, .small, .filter-btn, .refresh-btn { touch-action: manipulation; }
    }

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://kbzspuxrwsuxoyozmvjb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_oC0S_vWgBt_X8N4Xu4cG4g_ekhGwKXB';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Frontend hardening: never inject database/user text into HTML without escaping it.
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }


    function safeErrorMessage(error, fallback) {
      console.error(error);
      return fallback || '操作失败，请稍后重试。';
    }

    function setButtonBusy(btn, busy, busyText, normalText) {
      if (!btn) return;
      btn.disabled = !!busy;
      btn.textContent = busy ? busyText : normalText;
    }

    function readPriceInput(inputId) {
      const input = document.getElementById(inputId);
      const raw = input ? input.value.trim() : '';
      const price = Number(raw);
      if (raw === '' || !Number.isFinite(price) || price < 0) {
        alert('请输入有效价格（RM），可以填写小数，例如 2.50。');
        if (input) input.focus();
        return null;
      }
      return Math.round((price + Number.EPSILON) * 100) / 100;
    }

    // SECURITY NOTE:
    // The publishable Supabase key is safe to ship in frontend code only when
    // Row Level Security (RLS) policies protect every table/storage action.
    // Never put a Supabase service_role key or a real admin password in this file.
    let currentMenuType = 'lunch';
    let currentOptType = 'lunch';

    let dateFilter = 'today';
    let periodFilter = 'all';
    let paymentFilter = 'all';
    let ordersLoadSeq = 0;

    function setOwnerPage(page) {
      const pages = {
        orders: ['summaryBox', 'ownerOrders'],
        menu: ['ownerProducts'],
        options: ['ownerOptions'],
        feedback: ['ownerPendingFeedback', 'ownerApprovedFeedback']
      };
      const validPage = Object.prototype.hasOwnProperty.call(pages, page) ? page : 'orders';
      ['summaryBox', 'ownerOrders', 'ownerProducts', 'ownerOptions', 'ownerPendingFeedback', 'ownerApprovedFeedback'].forEach(function(id) {
        const el = document.getElementById(id);
        if (el) el.style.display = pages[validPage].includes(id) ? '' : 'none';
      });
      document.querySelectorAll('.owner-quick-nav [data-owner-page]').forEach(function(button) {
        const active = button.dataset.ownerPage === validPage;
        button.classList.toggle('active', active);
        button.setAttribute('aria-current', active ? 'page' : 'false');
      });
      window.scrollTo({top: 0, behavior: 'auto'});
    }

    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('pw').value;
      const err = document.getElementById('err');

      if (!email || !password) {
        err.textContent = '请输入管理员邮箱和密码';
        return;
      }

      err.textContent = '登录中…';
      try {
        const {data, error} = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error || !data.session) {
          console.error(error);
          err.textContent = '登录失败，请检查账号或密码';
          return;
        }

        await showAdmin();
      } catch (error) {
        console.error('Owner 登录请求失败:', error);
        err.textContent = '网络异常，请检查连接后重试';
      }
    }

    let adminViewReady = false;

    async function showAdmin() {
      if (adminViewReady) return;
      adminViewReady = true;

      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('main').classList.remove('hidden');
      document.getElementById('logoutBtn').classList.remove('hidden');
      setOwnerPage('orders');

      await loadOrders();
      await loadProducts();
      await loadFeedback();
      await loadOptions();
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      location.reload();
    }

    async function restoreSession() {
      const {data} = await supabaseClient.auth.getSession();
      if (data && data.session) {
        await showAdmin();
      }
    }

    supabaseClient.auth.onAuthStateChange(function (event, session) {
      if (event === 'SIGNED_IN' && session) showAdmin();
      if (event === 'SIGNED_OUT') location.reload();
    });

    function setDateFilter(value) {
      dateFilter = value;

      document.getElementById('dateTodayBtn')
        .classList.toggle('active', value === 'today');

      document.getElementById('dateAllBtn')
        .classList.toggle('active', value === 'all');

      loadOrders();
    }

    function setPeriodFilter(value) {
      periodFilter = value;

      document.getElementById('periodAllBtn')
        .classList.toggle('active', value === 'all');

      document.getElementById('periodBreakfastBtn')
        .classList.toggle('active', value === 'breakfast');

      document.getElementById('periodLunchBtn')
        .classList.toggle('active', value === 'lunch');

      document.getElementById('periodDrinkBtn')
        .classList.toggle('active', value === 'drink');

      loadOrders();
    }

    function setPaymentFilter(value) {
      paymentFilter = value;

      document.getElementById('paymentAllBtn')
        .classList.toggle('active', value === 'all');

      document.getElementById('paymentUnpaidBtn')
        .classList.toggle('active', value === 'unpaid');

      document.getElementById('paymentPaidBtn')
        .classList.toggle('active', value === 'paid');

      loadOrders();
    }

    function fmtTime(t) {
      const d = new Date(t);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const mi = String(d.getMinutes()).padStart(2, '0');
      return mm + '-' + dd + ' ' + hh + ':' + mi;
    }

    function loadProducts() {

      const requestedMenuType = currentMenuType;

      box.innerHTML = '<div class="noorders">加载中…</div>';

      supabaseClient.from('menu_products')
        .select('*')
        .eq('menu_type', requestedMenuType)
        .order('sort', {ascending:true})
        .order('id', {ascending:true})
        .then(function(res) {
          // 忽略较早的请求，避免快速切换早餐/午餐时旧列表覆盖新列表。
          if (loadSeq !== productsLoadSeq) return;
          if (res.error) {
            console.error(res.error);
            box.innerHTML = '<div class="noorders" style="color:#c0392b;">加载商品失败，请稍后重试。</div>';
            return;

          const rows = res.data || [];

                : '<div class="menu-image-thumb" style="display:flex;align-items:center;justify-content:center;color:#aaa;font-size:11px">无图片</div>';

                '<div class="menu-product-en">' + escapeHtml(p.name_en || '') + '</div>' +
                '<div class="menu-product-meta">RM ' + Number(p.price || 0).toFixed(2) +

                '<div class="menu-product-status ' + (p.active ? 'on' : 'off') + '">' +

    async function deleteProduct() {
      if (!editingProductId) return;

      const id = Number(editingProductId);
      const name = document.getElementById('editProductZh').value.trim() || '这个商品';

      if (!confirm('确定删除「' + name + '」吗？\n\n商品及其选项会被删除，历史订单不会被删除。')) return;

      const deleteBtn = document.getElementById('productDeleteBtn');
      setButtonBusy(deleteBtn, true, '删除中…', '删除商品');

      try {
        const current = await supabaseClient.from('menu_products')
          .select('id,image_url')
          .eq('id', id)
          .maybeSingle();

        if (current.error) throw current.error;
        if (!current.data) {
          throw new Error('商品不存在，可能已经被删除。');
        }

        const imageUrl = current.data.image_url || '';

        const res = await supabaseClient.from('menu_products')
          .delete()
          .eq('id', id);

        if (res.error) throw res.error;

        // 删除数据库商品成功后，再尝试清理 Storage 里的旧图片。
        if (imageUrl) {
          try {
            const marker = '/storage/v1/object/public/menu-images/';
            const pos = imageUrl.indexOf(marker);
            if (pos !== -1) {
              const path = decodeURIComponent(imageUrl.slice(pos + marker.length));
              if (path) {
                await supabaseClient.storage.from('menu-images').remove([path]);
              }
            }
          } catch (imageErr) {
            console.warn('旧菜单图片清理失败：', imageErr);
          }
        }

        const deletedId = id;
        closeProductEditModal();

        if (Number(selectedOptionProductId) === deletedId) {
          selectedOptionProductId = null;
        }

        await loadProducts();
        await refreshOptionProductSelect();

        const select = document.getElementById('optionProductSelect');
        if (select && select.value) {
          selectedOptionProductId = Number(select.value);
          await loadOptions();
        } else {
          document.getElementById('optionsBox').innerHTML =
            '<div class="noorders">请选择商品查看选项。</div>';
        }

        alert('商品已删除。');
      } catch (err) {
        console.error(err);
        alert('删除商品失败：' + (err.message || '请稍后重试。'));
      } finally {
        setButtonBusy(deleteBtn, false, '删除中…', '删除商品');
      }
    }

    function validateMenuImage(file) {
      if (!file) return null;
      const allowed = ['image/jpeg', 'image/png', 'image/webp'];
      if (!allowed.includes(file.type)) {
        throw new Error('只支持 JPG、PNG、WEBP 图片。');
      }
      if (file.size > 5 * 1024 * 1024) {
        throw new Error('图片不能超过 5MB。');
      }
      return file;
    }

    function previewMenuImage(input, previewId) {
      const file = input && input.files ? input.files[0] : null;
      const box = document.getElementById(previewId);
      if (!box) return;
      if (!file) {
        box.innerHTML = '暂无图片';
        box.className = 'menu-image-placeholder';
        return;
      }
      try {
        validateMenuImage(file);
      } catch (err) {
        alert(err.message);
        input.value = '';
        box.innerHTML = '暂无图片';
        box.className = 'menu-image-placeholder';
        return;
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        box.className = '';
        box.innerHTML = '<img class="menu-image-preview" src="' + e.target.result + '" alt="">';
      };
      reader.readAsDataURL(file);
    }

    async function uploadMenuImage(file, productId) {
      validateMenuImage(file);
      const ext = file.type === 'image/png' ? 'png' : (file.type === 'image/webp' ? 'webp' : 'jpg');
      const path = 'product_' + productId + '_' + crypto.randomUUID() + '.' + ext;
      const up = await supabaseClient.storage.from('menu-images').upload(path, file, {
        contentType: file.type,
        upsert: false
      });
      if (up.error) throw up.error;
      const pub = supabaseClient.storage.from('menu-images').getPublicUrl(path);
      return pub.data.publicUrl;
    }

    async function addProduct() {
      const zh = document.getElementById('productZh').value.trim();
      const en = document.getElementById('productEn').value.trim() || zh;
      const descZh = document.getElementById('productDescZh').value.trim();
      const descEn = document.getElementById('productDescEn').value.trim();
      const price = readPriceInput('productPrice');
      if (price === null) return;
      const maxPortions = Math.max(1, parseInt(document.getElementById('productMax').value, 10) || 15);
      const imageFile = document.getElementById('productImage').files[0] || null;
      const saveBtn = document.getElementById('productSaveBtn');

      if (!zh) {
        alert('请输入商品中文名。');
        document.getElementById('productZh').focus();
        return;
      }

      setButtonBusy(saveBtn, true, '保存中…', '保存商品');

      try {
        const sortRes = await supabaseClient.from('menu_products')
          .select('sort')
          .eq('menu_type', currentMenuType)
          .order('sort', {ascending:false})
          .limit(1);

        if (sortRes.error) throw sortRes.error;

        const nextSort = sortRes.data && sortRes.data.length
          ? Number(sortRes.data[0].sort || 0) + 1
          : 1;

        const res = await supabaseClient.from('menu_products').insert({
          menu_type: currentMenuType,
          name_zh: zh,
          name_en: en,
          desc_zh: descZh,
          desc_en: descEn,
          price: price,
          max_portions: maxPortions,
          active: true,
          sort: nextSort
        }).select('id').single();

        if (res.error) throw res.error;

        if (imageFile) {
          const imageUrl = await uploadMenuImage(imageFile, res.data.id);
          const imageUpdate = await supabaseClient.from('menu_products')
            .update({image_url: imageUrl})
            .eq('id', res.data.id);
          if (imageUpdate.error) throw imageUpdate.error;
        }

        closeProductModal();
        await loadProducts();
      } catch (err) {
        safeErrorMessage(err, '添加商品失败，请稍后重试。');
        alert('添加商品失败，请稍后重试。');
      } finally {
        setButtonBusy(saveBtn, false, '保存中…', '保存商品');

      supabaseClient.from('product_options')
        .select('*')
        .eq('id', editingOptionId)
        .maybeSingle()
        .then(function(res) {
          if (res.error || !res.data) {
            console.error(res.error);
            alert('无法读取选项资料，请稍后重试。');
            return;
          }

          const o = res.data;
          document.getElementById('editOptionZh').value = o.label_zh || '';
          document.getElementById('editOptionEn').value = o.label_en || '';
          document.getElementById('editOptionDescZh').value = o.desc_zh || '';
          document.getElementById('editOptionDescEn').value = o.desc_en || '';
          document.getElementById('editOptionPrice').value = Number(o.price || 0);
          document.getElementById('editOptionMax').value = Number(o.max_portions || 15);
          document.getElementById('editOptionSort').value = Number(o.sort || 0);
          document.getElementById('editOptionEnabled').checked = !!o.enabled;

          document.getElementById('optionEditModal').classList.add('open');
          setTimeout(function () { document.getElementById('editOptionZh').focus(); }, 50);
        });
    }

    function closeOptionEditModal() {
      const modal = document.getElementById('optionEditModal');
      if (modal) modal.classList.remove('open');
      editingOptionId = null;
    }

    async function saveOptionEdit() {
      if (!editingOptionId) return;

      const zh = document.getElementById('editOptionZh').value.trim();
      const en = document.getElementById('editOptionEn').value.trim() || zh;
      const descZh = document.getElementById('editOptionDescZh').value.trim();
      const descEn = document.getElementById('editOptionDescEn').value.trim();
      const price = readPriceInput('editOptionPrice');
      if (price === null) return;
      const maxPortions = Math.max(1, parseInt(document.getElementById('editOptionMax').value, 10) || 15);
      const sort = Math.max(0, parseInt(document.getElementById('editOptionSort').value, 10) || 0);
      const enabled = document.getElementById('editOptionEnabled').checked;
      const saveBtn = document.getElementById('optionEditSaveBtn');

      if (!zh) {
        alert('请输入选项中文名。');
        document.getElementById('editOptionZh').focus();
        return;
      }

      setButtonBusy(saveBtn, true, '保存中…', '保存修改');

      try {
        const res = await supabaseClient.from('product_options')
          .update({
            label_zh: zh,
            label_en: en,
            desc_zh: descZh,
            desc_en: descEn,
            price: price,
            max_portions: maxPortions,
            sort: sort,
            enabled: enabled
          })
          .eq('id', editingOptionId);

        if (res.error) throw res.error;

        closeOptionEditModal();
        await loadOptions();
      } catch (err) {
        safeErrorMessage(err, '选项保存失败，请稍后重试。');
        alert('选项保存失败，请稍后重试。');
      } finally {
        setButtonBusy(saveBtn, false, '保存中…', '保存修改');
      }
    }

    function closeOptionModal() {
      const modal = document.getElementById('optionModal');
      if (modal) modal.classList.remove('open');
    }

    function openOptionModal() {
      if (!selectedOptionProductId) {
        alert('请先选择商品。');
        return;
      }
      const modal = document.getElementById('optionModal');
      if (!modal) return;
      document.getElementById('optionZh').value = '';
      document.getElementById('optionEn').value = '';
      document.getElementById('optionDescZh').value = '';
      document.getElementById('optionDescEn').value = '';
      document.getElementById('optionPrice').value = '';
      document.getElementById('optionMax').value = '15';
      modal.classList.add('open');
      setTimeout(function () { document.getElementById('optionZh').focus(); }, 50);
    }

    async function addOption() {
      if (!selectedOptionProductId) {
        alert('请先选择商品。');
        return;
      }

      const zh = document.getElementById('optionZh').value.trim();
      const en = document.getElementById('optionEn').value.trim() || zh;
      const descZh = document.getElementById('optionDescZh').value.trim();
      const descEn = document.getElementById('optionDescEn').value.trim();
      const price = readPriceInput('optionPrice');
      if (price === null) return;
      const maxPortions = Math.max(1, parseInt(document.getElementById('optionMax').value, 10) || 15);
      const saveBtn = document.getElementById('optionSaveBtn');

      if (!zh) {
        alert('请输入选项中文名。');
        document.getElementById('optionZh').focus();
        return;
      }

      setButtonBusy(saveBtn, true, '保存中…', '保存选项');

      try {
        const res = await supabaseClient.from('product_options').insert({
          label_zh: zh,
          label_en: en,
          desc_zh: descZh,
          desc_en: descEn,
          price: price,
          max_portions: maxPortions,
          enabled: true,
          sort: 99,
          product_id: selectedOptionProductId
        });

        if (res.error) throw res.error;

        closeOptionModal();
        await loadOptions();
      } catch (err) {
        safeErrorMessage(err, '添加选项失败，请稍后重试。');
        alert('添加选项失败，请稍后重试。');
      } finally {
        setButtonBusy(saveBtn, false, '保存中…', '保存选项');
      }
    }

    function delOption(id) {
      if (!confirm('确认删除这个选项？')) return;
      supabaseClient.from('product_options').delete().eq('id', id).then(function(res) {
        if (res.error) {console.error(res.error); alert('操作失败，请稍后重试。'); return;}
        loadOptions();
      });
    }

    function getMealDate() {
      const now = new Date();
      const h = now.getHours();
      if (h >= 15) {now.setDate(now.getDate() + 1);}
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }

    async function loadOrders() {
      const loadSeq = ++ordersLoadSeq;
      const box = document.getElementById('ordersBox');

      box.innerHTML =
        '<div style="padding:25px;text-align:center;color:#888;">加载订单中...</div>';

      let q = supabaseClient
        .from('orders')
        .select('*')
        .order('created_at', {ascending: false});

      // 日期
      if (dateFilter === 'today') {
        q = q.eq('meal_date', getMealDate());
      }

      // 餐别
      if (periodFilter !== 'all') {
        q = q.eq('meal_period', periodFilter);
      }

      // 付款状态
      if (paymentFilter === 'paid') {
        q = q.eq('paid', true);
      }

      if (paymentFilter === 'unpaid') {
        q = q.eq('paid', false);
      }

      const {data, error} = await q;

      if (loadSeq !== ordersLoadSeq) return;

      if (error) {
        console.error('加载订单失败:', error);

        box.innerHTML =
          '<div style="padding:25px;text-align:center;color:#c0392b;">' +
          '订单加载失败：' +
          escapeHtml(error.message) +
          '</div>';

        return;
      }

      renderOrders(data || []);
    }

    function renderOrders(list) {
      const box = document.getElementById('ordersBox');

      if (!list || !list.length) {
        box.innerHTML =
          '<div class="noorders">暂无订单</div>';
        return;
      }

      /* =========================
         桌面版表格
         ========================= */

      let tableHtml =
        '<table>' +
        '<thead>' +
        '<tr>' +
        '<th>订单号</th>' +
        '<th>日期</th>' +
        '<th>时段</th>' +
        '<th>姓名</th>' +
        '<th>数量</th>' +
        '<th>金额</th>' +
        '<th>付款方式</th>' +
        '<th>付款状态</th>' +
        '<th>操作</th>' +
        '</tr>' +
        '</thead>' +
        '<tbody>';

      /* =========================
         手机版卡片
         ========================= */

      let mobileHtml =
        '<div class="orders-mobile">';

      list.forEach(function (o) {
        const periodText =
          o.meal_period === 'breakfast'
            ? '早餐'
            : (o.meal_period === 'drink' ? '饮料' : '午餐');

        const paymentMethod =
          o.payment_method === 'online'
            ? '线上付款'
            : '现金';

        const paid = !!o.paid;

        const paymentStatus = paid
          ? '<span class="payment-status paid">已付款</span>'
          : '<span class="payment-status unpaid">待付款</span>';

        const mealDate =
          o.meal_date
            ? o.meal_date
            : '-';

        const note =
          o.note
            ? escapeHtml(o.note)
            : '—';

        /* ===== 桌面 ===== */

        tableHtml +=
          '<tr>' +
          '<td><strong>' + escapeHtml(o.order_code || '') + '</strong></td>' +
          '<td>' + escapeHtml(mealDate) + '</td>' +
          '<td>' + periodText + '</td>' +
          '<td>' + escapeHtml(o.name || '') + '</td>' +
          '<td>' + Number(o.quantity || 0) + '</td>' +
          '<td>RM ' + Number(o.total || 0).toFixed(2) + '</td>' +
          '<td>' + paymentMethod + '</td>' +
          '<td>' + paymentStatus + '</td>' +
          '<td>' +
          (o.payment_method === 'online'
            ? (o.payment_proof
              ? '<button class="small" onclick="viewImg(\'' +
              escapeHtml(o.payment_proof) +
              '\')">付款证明</button> '
              : '<button class="small gray" onclick="alert(\'这笔订单还没有上传付款凭证。\')">未上传凭证</button> ')
            : '') +

          (!paid
            ? '<button class="small green" onclick="confirmPaid(\'' +
            o.id +
            '\')">确认</button> '
            : '') +

          '<button class="small red" onclick="deleteOrder(\'' +
          o.id +
          '\')">删除</button>' +
          '</td>' +
          '</tr>';

        /* ===== 手机 ===== */

        mobileHtml +=
          '<div class="order-card">' +

          '<div class="order-card-head">' +
          '<div class="order-card-code">' +
          escapeHtml(o.order_code || '') +
          '</div>' +

          '<div class="order-card-period">' +
          periodText +
          '</div>' +
          '</div>' +

          '<div class="order-card-name">' +
          escapeHtml(o.name || '') +
          '</div>' +

          '<div class="order-card-info">' +

          '<div class="order-card-item">' +
          '日期' +
          '<strong>' +
          escapeHtml(mealDate) +
          '</strong>' +
          '</div>' +

          '<div class="order-card-item">' +
          '数量' +
          '<strong>' +
          Number(o.quantity || 0) +
          '</strong>' +
          '</div>' +

          '<div class="order-card-item">' +
          '订单金额' +
          '<strong>RM ' +
          Number(o.total || 0).toFixed(2) +
          '</strong>' +
          '</div>' +

          '<div class="order-card-item">' +
          '付款方式' +
          '<strong>' +
          paymentMethod +
          '</strong>' +
          '</div>' +

          '</div>' +

          '<div class="order-card-payment">' +
          '付款状态：' +
          paymentStatus +
          '</div>' +

          '<div class="order-card-item" style="margin-bottom:12px;">' +
          '备注' +
          '<strong>' +
          note +
          '</strong>' +
          '</div>' +

          '<div class="order-card-actions">' +

          (o.payment_method === 'online'
            ? (o.payment_proof
              ? '<button class="small" onclick="viewImg(\'' +
              escapeHtml(o.payment_proof) +
              '\')">查看付款证明</button>'
              : '<button class="small gray" onclick="alert(\'这笔订单还没有上传付款凭证。\')">未上传凭证</button>')
            : '') +

          (!paid
            ? '<button class="small green" onclick="confirmPaid(\'' +
            o.id +
            '\')">确认付款</button>'
            : '') +

          '<button class="small red" onclick="deleteOrder(\'' +
          o.id +
          '\')">删除</button>' +

          '</div>' +

          '</div>';
      });

      tableHtml +=
        '</tbody>' +
        '</table>';

      mobileHtml +=
        '</div>';

      box.innerHTML =
        tableHtml +
        mobileHtml;
    }
    async function viewImg(url) {
      const rawUrl = String(url || '').trim();

      if (!rawUrl) {
        alert('无效的付款凭证');
        return;
      }

      let path = rawUrl;

      const marker = '/storage/v1/object/public/payments/';
      const index = rawUrl.indexOf(marker);

      if (index !== -1) {
        path = rawUrl.substring(index + marker.length);
      }

      if (!path || path.includes('..') || path.startsWith('/')) {
        alert('无效的付款凭证');
        return;
      }

      const result = await supabaseClient.storage
        .from('payments')
        .createSignedUrl(path, 300);

      if (result.error || !result.data?.signedUrl) {
        console.error('付款凭证错误:', result.error);
        alert('无法打开付款凭证');
        return;
      }

      const safeUrl = result.data.signedUrl;

      document.getElementById('imgModal').innerHTML =
        '<button onclick="closeImg()" ' +
        'style="position:absolute;top:20px;right:25px;' +
        'font-size:32px;background:#fff;border:0;border-radius:50%;' +
        'width:45px;height:45px;cursor:pointer;z-index:10;">×</button>' +
        '<img src="' + escapeHtml(safeUrl) + '" ' +
        'style="max-width:90%;max-height:85%;border-radius:8px;background:#fff">';

      document.getElementById('imgModal').classList.add('open');
    }

    function closeImg() {
      const modal = document.getElementById('imgModal');

      if (!modal) return;

      modal.classList.remove('open');
      modal.innerHTML = '';
    }

    document.getElementById('imgModal')?.addEventListener('click', function (e) {
      if (e.target === this) {
        closeImg();
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        closeImg();
      }
    });
    async function deleteOrder(id) {
      if (!confirm('确认删除？不可恢复。')) return;
      const res = await supabaseClient.rpc('delete_order', {p_order_id: Number(id)});
      if (res.error) {
        console.error(res.error);
        alert('操作失败，请稍后重试。');
        return;
      }
      loadOrders();
      loadProducts();
      loadOptions();
    }

    restoreSession();
    function closeModal() {
      const modal = document.getElementById('imgModal');

      if (!modal) return;

      modal.classList.remove('open');
      modal.innerHTML = '';
    }

    async function confirmPaid(id) {
      if (!id) {
        alert('无效的订单 ID');
        return;
      }

      if (!confirm('确认这个订单已经付款吗？')) {
        return;
      }

      const {data, error} = await supabaseClient.rpc(
        'confirm_order_paid',
        {p_order_id: Number(id)}
      );

      console.log('确认订单:', data, error);

      if (error) {
        console.error('确认订单失败:', error);
        alert('确认失败：' + error.message);
        return;
      }

      if (data !== true) {
        alert('订单不存在或没有更新成功');
        return;
      }

      alert('订单已确认付款');

      await loadOrders();
    }
  </script>
