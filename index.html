<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YeranFood｜校园点餐</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f7f5f0;
      color: #222
    }

    header {
      background: #111;
      color: #fff;
      padding: 32px 20px;
      text-align: center;
      position: relative
    }

    header h1 {
      margin: 0;
      font-size: 36px;
      letter-spacing: 2px;
      font-weight: 800
    }

    header p {
      margin: 8px 0 0;
      color: #999;
      font-size: 14px;
      letter-spacing: 1px
    }

    .lang button {
      border: 1.5px solid #444;
      background: transparent;
      color: #fff;
      border-radius: 24px;
      padding: 8px 16px;
      margin: 0 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all .15s;
      font-weight: 500
    }

    .lang button:hover {
      border-color: #fff
    }

    .lang button.active {
      background: #fff;
      color: #111;
      border-color: #fff
    }

    .container {
      max-width: 620px;
      margin: 25px auto;
      padding: 0 16px
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 18px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .06);
      border: 1px solid #f0f0f0
    }

    .food {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
      padding-bottom: 20px;
      border-bottom: 1px solid #f0f0f0;
      margin-bottom: 20px
    }

    .qty button {
      width: 42px;
      height: 42px;
      border: 1.5px solid #e5e5e5;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      background: #fff;
      transition: all .15s;
      font-weight: 700;
      color: #111
    }

    .qty button:hover {
      background: #111;
      color: #fff;
      border-color: #111
    }

    .qty button:active {
      transform: scale(.92)
    }

    .qty span {
      font-size: 22px;
      font-weight: 800;
      min-width: 32px;
      text-align: center
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 600
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1.5px solid #e5e5e5;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      transition: border-color .2s;
      background: #fafafa
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #111;
      background: #fff
    }

    textarea {
      resize: vertical;
      min-height: 60px
    }

    .opt label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      padding: 12px 16px;
      border: 1.5px solid #e5e5e5;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: all .15s;
      background: #fafafa
    }

    .opt label:hover {
      border-color: #999
    }

    .opt label:has(input:checked) {
      border-color: #111;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08)
    }

    .payBox {
      margin-top: 6px;
      padding: 14px;
      border: 1px dashed #ddd;
      border-radius: 10px;
      background: #fafafa
    }

    .uploadBtn {
      display: inline-block;
      padding: 10px 18px;
      background: #111;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700
    }

    .uploadBtn:hover {
      opacity: .85
    }

    .preview {
      margin-top: 10px;
      display: none
    }

    .preview img {
      max-width: 200px;
      border-radius: 8px;
      border: 1px solid #ddd
    }

    .fileName {
      font-size: 13px;
      color: #666;
      margin-top: 6px
    }

    .total {
      display: flex;
      justify-content: space-between;
      font-size: 21px;
      font-weight: 700;
      margin-top: 20px
    }

    .submit {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: #111;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      letter-spacing: .5px
    }

    .submit:hover {
      background: #000;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, .2)
    }

    .submit:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .15)
    }

    .submit:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none
    }

    .notice {
      font-size: 13px;
      color: #777;
      margin-top: 10px;
      line-height: 1.5
    }

    .success {
      display: none;
      text-align: center
    }

    .success .check {
      font-size: 52px
    }

    .orderid {
      font-weight: 700;
      font-size: 20px
    }

    footer {
      text-align: center;
      color: #888;
      padding: 20px
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 28px 24px;
      margin-bottom: 18px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .06);
      border: 1px solid #f0f0f0
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    h1 {
      animation: fadeIn .6s ease
    }

    .feedbackBtn {
      background: transparent;
      border: 1.5px solid #ddd;
      color: #666;
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 14px;
      cursor: pointer;
      transition: all .2s;
      font-family: inherit
    }

    .feedbackBtn:hover {
      border-color: #111;
      color: #111;
      transform: translateY(-1px)
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2.5px solid #ddd;
      border-top-color: #111;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      vertical-align: middle
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @media (max-width:640px) {
      .submit {
        position: sticky;
        bottom: 12px;
        z-index: 10;
        box-shadow: 0 4px 20px rgba(0, 0, 0, .15)
      }
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0)
      }

      25% {
        transform: translateX(-2px)
      }

      75% {
        transform: translateX(2px)
      }
    }

    .stock-low {
      color: #e67e22 !important;
      animation: shake 1.2s infinite
    }

    .stock-zero {
      color: #c0392b !important;
      font-weight: 800
    }

    @keyframes popIn {
      0% {
        transform: scale(0);
        opacity: 0
      }

      50% {
        transform: scale(1.2)
      }

      100% {
        transform: scale(1);
        opacity: 1
      }
    }

    .success.show .check {
      animation: popIn .5s cubic-bezier(.34, 1.56, .64, 1)
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(12px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .success.show h2,
    .success.show p,
    .success.show .orderid {
      animation: slideUp .5s ease forwards;
      opacity: 0
    }

    .success.show h2 {
      animation-delay: .15s
    }

    .success.show .orderid {
      animation-delay: .25s
    }

    .success.show p {
      animation-delay: .35s
    }

    .price {
      font-weight: 700;
      font-size: 20px;
      color: #1a7f37
    }

    #total {
      color: #1a7f37
    }

    .opt label:has(input:checked) {
      border-color: #1a73e8;
      background: #f0f7ff;
      box-shadow: 0 2px 8px rgba(26, 115, 232, .15)
    }

    .opt label:has(input:checked) input {
      accent-color: #1a73e8
    }

    .food h2 {
      margin: 0 0 6px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -.5px
    }

    #foodDesc {
      font-size: 14px;
      color: #888;
      line-height: 1.5
    }

    #stockInfo {
      font-size: 13px;
      margin-top: 10px
    }

    #menuTitle {
      font-size: 14px;
      font-weight: 600;
      color: #888;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px
    }

    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 8px
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0
      }

      100% {
        background-position: -200% 0
      }
    }

    .sk-title {
      height: 28px;
      width: 60%;
      margin-bottom: 8px
    }

    .sk-desc {
      height: 16px;
      width: 80%;
      margin-bottom: 16px
    }

    .sk-row {
      height: 42px;
      width: 100%;
      margin-bottom: 10px
    }

    body.dark {
      background: #0a0a0a;
      color: #eee
    }

    body.dark .card {
      background: #1a1a1a;
      border-color: #2a2a2a;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .5)
    }

    body.dark input,
    body.dark textarea {
      background: #222;
      border-color: #333;
      color: #eee
    }

    body.dark input:focus,
    body.dark textarea:focus {
      border-color: #fff;
      background: #2a2a2a
    }

    body.dark .opt label {
      background: #222;
      border-color: #333
    }

    body.dark .opt label:has(input:checked) {
      background: #1a2a3a;
      border-color: #1a73e8
    }

    body.dark .qty button {
      background: #222;
      border-color: #333;
      color: #eee
    }

    body.dark .qty button:hover {
      background: #fff;
      color: #111
    }

    body.dark #menuTitle {
      color: #666
    }

    body.dark .food {
      border-bottom-color: #2a2a2a
    }

    body.dark #foodDesc {
      color: #666
    }

    body.dark .total {
      border-top-color: #2a2a2a
    }

    body.dark footer {
      color: #666
    }

    body.dark .skeleton {
      background: linear-gradient(90deg, #222 25%, #2a2a2a 50%, #222 75%);
      background-size: 200% 100%
    }

    body.dark .feedbackBtn {
      border-color: #333;
      color: #999
    }

    body.dark .feedbackBtn:hover {
      border-color: #fff;
      color: #fff
    }

    #bottomNav {
      display: none
    }

    @media (max-width:640px) {
      #bottomNav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #fff;
        border-top: 1px solid #eee;
        justify-content: space-around;
        padding: 8px 0;
        z-index: 100;
        box-shadow: 0 -2px 12px rgba(0, 0, 0, .04)
      }

      .navBtn {
        background: transparent;
        border: 0;
        color: #999;
        cursor: pointer;
        padding: 6px 20px;
        font-family: inherit;
        transition: color .2s
      }

      .navBtn.active {
        color: #111
      }

      body {
        padding-bottom: 70px
      }

      body.dark #bottomNav {
        background: #1a1a1a;
        border-top-color: #2a2a2a
      }

      body.dark .navBtn.active {
        color: #fff
      }
    }

    .periodBtn {
      flex: 1;
      padding: 12px;
      border: 1.5px solid #e5e5e5;
      background: #fff;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      font-family: inherit;
      margin: 0 4px
    }

    .periodBtn.active {
      background: #111;
      color: #fff;
      border-color: #111
    }

    body.dark #feedbackListModal>div {
      background: #1a1a1a !important;
      color: #eee;
    }

    body.dark #feedbackListModal button {
      background: #333 !important;
      color: #eee !important;
    }

    body.dark #feedbackListModal [style*="background:#fafafa"] {
      background: #222 !important;
      border-color: #333 !important;
    }

    body.dark #feedbackListModal [style*="color:#444"] {
      color: #ddd !important;
    }

    /* =========================
   早餐商品卡片
========================= */

    .breakfast-product {
      display: none;
      margin-bottom: 24px;
    }

    .breakfast-product-card {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      padding: 24px;
      background: linear-gradient(145deg, #fffdf8, #fff);
      border: 1px solid #eee7da;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .06);
    }

    .breakfast-product-card::before {
      content: '🥪';
      position: absolute;
      right: 18px;
      top: 12px;
      font-size: 58px;
      opacity: .12;
    }

    .breakfast-badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      background: #fff1d6;
      color: #9a6500;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .breakfast-product-name {
      margin: 0;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -.6px;
    }

    .breakfast-product-desc {
      margin-top: 8px;
      color: #777;
      font-size: 14px;
      line-height: 1.6;
      max-width: 85%;
    }

    .breakfast-price {
      margin-top: 18px;
      font-size: 24px;
      font-weight: 800;
      color: #1a7f37;
    }

    .breakfast-choice-title {
      margin: 20px 0 10px;
      font-size: 13px;
      font-weight: 700;
      color: #888;
      letter-spacing: .5px;
    }

    .breakfast-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .breakfast-option {
      display: flex !important;
      align-items: center !important;
      padding: 14px 16px !important;
      border-radius: 14px !important;
      background: #fafafa !important;
      border: 1.5px solid #e5e5e5 !important;
      transition: all .18s ease;
    }

    .breakfast-option:hover {
      border-color: #bbb !important;
      transform: translateY(-1px);
    }

    .breakfast-option:has(input:checked) {
      border-color: #1a73e8 !important;
      background: #f0f7ff !important;
      box-shadow: 0 4px 14px rgba(26, 115, 232, .12);
    }

    .breakfast-option-main {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .breakfast-option-text {
      flex: 1;
    }

    .breakfast-option-name {
      font-weight: 700;
      font-size: 15px;
    }

    .breakfast-option-desc {
      margin-top: 3px;
      font-size: 12px;
      color: #888;
      line-height: 1.4;
    }

    .breakfast-option-price {
      font-weight: 800;
      font-size: 16px;
      color: #1a7f37;
      white-space: nowrap;
    }

    .breakfast-qty {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid #eee;
    }

    .breakfast-qty-title {
      font-size: 14px;
      font-weight: 700;
      color: #555;
    }

    body.dark .breakfast-product-card {
      background: linear-gradient(145deg, #202020, #181818);
      border-color: #333;
    }

    body.dark .breakfast-badge {
      background: #3a2d17;
      color: #f2c66d;
    }

    body.dark .breakfast-product-desc,
    body.dark .breakfast-qty-title {
      color: #999;
    }

    body.dark .breakfast-option {
      background: #222 !important;
      border-color: #333 !important;
    }

    body.dark .breakfast-option:has(input:checked) {
      background: #1a2a3a !important;
      border-color: #1a73e8 !important;
    }

    body.dark .breakfast-option-desc {
      color: #777;
    }

    @media (max-width:640px) {
      .breakfast-product-card {
        padding: 20px;
        border-radius: 18px;
      }

      .breakfast-product-name {
        font-size: 24px;
      }

      .breakfast-product-desc {
        max-width: 92%;
      }
    }

    /* =========================
   早餐选择卡片优化
========================= */

    .breakfast-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
    }

    .breakfast-option {
      position: relative;
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 15px 16px;
      border: 2px solid #eee;
      border-radius: 16px;
      background: #fff;
      cursor: pointer;
      transition: all .2s ease;
    }

    .breakfast-option:hover {
      border-color: #f0b35a;
      transform: translateY(-1px);
    }

    .breakfast-option:has(input:checked) {
      border-color: #e89b32;
      background: #fff8ed;
      box-shadow: 0 4px 14px rgba(232, 155, 50, .12);
    }

    .breakfast-option input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: #e89b32;
      flex-shrink: 0;
    }

    .breakfast-option-main {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .breakfast-option-text {
      flex: 1;
      min-width: 0;
    }

    .breakfast-option-name {
      font-size: 16px;
      font-weight: 700;
      color: #333;
      line-height: 1.4;
    }

    .breakfast-option-desc {
      margin-top: 4px;
      font-size: 13px;
      color: #888;
      line-height: 1.5;
    }

    .breakfast-option-price {
      font-size: 16px;
      font-weight: 700;
      color: #d98200;
      white-space: nowrap;
    }

    /* 选中提示 */
    .breakfast-option:has(input:checked)::after {
      display: none;
    }

    /* =========================
   早餐数量区域
========================= */

    .breakfast-qty {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .breakfast-qty-title {
      font-size: 15px;
      font-weight: 600;
      color: #555;
    }

    /* =========================
   早餐库存
========================= */

    #breakfastStock {
      text-align: right;
      min-height: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    #breakfastStock.stock-low {
      color: #d98200 !important;
    }

    #breakfastStock.stock-zero {
      color: #c0392b !important;
    }

    /* =========================
   深色模式
========================= */

    body.dark .breakfast-product-card {
      background: linear-gradient(145deg, #242424, #1d1d1d);
      border-color: #3a3a3a;
    }

    body.dark .breakfast-option {
      background: #252525;
      border-color: #3b3b3b;
    }

    body.dark .breakfast-option:has(input:checked) {
      background: #30291f;
      border-color: #e89b32;
    }

    body.dark .breakfast-option-name {
      color: #f1f1f1;
    }

    body.dark .breakfast-option-desc {
      color: #aaa;
    }

    body.dark .breakfast-qty {
      border-top-color: #3b3b3b;
    }

    body.dark .breakfast-qty-title {
      color: #ddd;
    }

    /* =========================
   手机端
========================= */

    @media (max-width: 600px) {

      .breakfast-product-card {
        padding: 18px;
        border-radius: 18px;
      }

      .breakfast-product-name {
        font-size: 22px;
        padding-right: 45px;
      }

      .breakfast-product-desc {
        font-size: 14px;
      }

      .breakfast-price {
        font-size: 22px;
        margin-top: 12px;
      }

      .breakfast-option {
        padding: 14px;
      }

      .breakfast-option-main {
        gap: 9px;
      }

      .breakfast-option-name {
        font-size: 15px;
      }

      .breakfast-option-price {
        font-size: 15px;
      }

      .breakfast-qty {
        align-items: center;
      }
    }

    /* =========================
   早餐商品顶部视觉区
========================= */

    .breakfast-hero {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 20px;
    }

    .breakfast-hero-icon {
      width: 78px;
      height: 78px;
      flex-shrink: 0;
      border-radius: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 42px;

      background: linear-gradient(135deg,
          #fff1d6,
          #ffe3b0);

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .8),
        0 6px 18px rgba(220, 150, 50, .12);
    }

    .breakfast-hero-info {
      flex: 1;
      min-width: 0;
    }

    .breakfast-badge {
      display: inline-flex;
      align-items: center;

      padding: 5px 10px;
      margin-bottom: 8px;

      border-radius: 999px;

      background: #fff0d7;
      color: #b86b00;

      font-size: 12px;
      font-weight: 700;
    }

    .breakfast-product-name {

      if (breakfastQty) {
        breakfastQty.textContent = qty;
      }
      updateTotal();

        document.getElementById('submitBtn').disabled = true;
        document.getElementById('submitBtn').textContent = t.soldOutBtn;

        document.getElementById('submitBtn').disabled = false;

    function changeBreakfastQty(productId, change) {

      const product = products.find(function (p) {
        return Number(p.id) === Number(productId);
      });

      if (!product) return;

      const left = Number(
        product.stockRemaining != null
          ? product.stockRemaining
          : product.max_portions || 0
      );

      let current = Number(
        breakfastQty[productId] || 1
      );

      current += change;

      if (current < 1) {
        current = 1;
      }

      if (current > left) {
        current = left;
      }

      if (left <= 0) {
        current = 1;
      }

      breakfastQty[productId] = current;

      const qtyEl =
        document.getElementById(
          'breakfastQty_' + productId
        );

      if (qtyEl) {
        qtyEl.textContent = current;
      }
    }

    function getMealDate() {
      const now = new Date();
      const h = now.getHours();

      /*
       * 早餐：
       * 15:00 后订的是第二天早餐
       */
      if (currentPeriod === 'breakfast' && h >= 15) {
        now.setDate(now.getDate() + 1);
      }

      /*
       * 午餐：
       * 15:00 后订的是第二天午餐
       */
      if (currentPeriod === 'lunch' && h >= 15) {
        now.setDate(now.getDate() + 1);
      }

      return now.getFullYear() + '-' +
        String(now.getMonth() + 1).padStart(2, '0') + '-' +
        String(now.getDate()).padStart(2, '0');
    }


    function isOrderingOpen() {
      const now = new Date();
      const h = now.getHours();

      /*
       * 早餐：
       * 15:00 开始接受第二天早餐订单
       * 00:00 截止
       */
      if (currentPeriod === 'breakfast') {
        return h >= 15;
      }

      /*
       * 午餐：
       * 00:00 - 14:59 接受今天午餐
       * 15:00 后接受第二天午餐
       */
      if (currentPeriod === 'lunch') {
        return true;
      }

      return false;
    }

    function loadOrdersToday() {

      const targetDate = getMealDate();

      if (!products || !products.length) {
        console.log('当前没有商品，products =', products);
        orderedQty = 0;
        renderMenu();
        return;
      }

      Promise.all(
        products.map(function (product) {

          return supabaseClient.rpc('get_product_stock', {
            p_product_id: product.id,
            p_meal_date: targetDate
          }).then(function (res) {

            if (res.error) {
              console.error(
                '读取商品库存失败:',
                product.id,
                res.error
              );

              product.stockTotal = Number(product.max_portions || 0);
              product.stockOrdered = 0;
              product.stockRemaining = Number(product.max_portions || 0);

              return;
            }

            const row = res.data && res.data[0]
              ? res.data[0]
              : null;

            product.stockTotal = row
              ? Number(row.total || 0)
              : Number(product.max_portions || 0);

            product.stockOrdered = row
              ? Number(row.ordered || 0)
              : 0;

            product.stockRemaining = row
              ? Number(row.remaining || 0)
              : Number(product.max_portions || 0);

          });

        })
      )
        .then(function () {

          console.log('商品库存加载完成:', products);

          // 只给旧版 UI 兼容使用
          if (menu) {
            orderedQty = Number(menu.stockOrdered || 0);
          } else {
            orderedQty = 0;
          }

          renderMenu();

        })
        .catch(function (err) {

          console.error('库存加载异常:', err);

          orderedQty = 0;
          renderMenu();

        });

    }

    function goToPayment() {
      if (currentPayMethod() === 'cash') {
        submitCashOrder();
        return;
      }
      const name = document.getElementById('name').value.trim();
      const note = document.getElementById('note').value.trim();
      if (!name) {alert(text[lang].error); return;}
      if (!menu) {alert(text[lang].noMenu); return;}

      const max = maxPortions();
      if (orderedQty + qty > max) {
        alert(lang === 'zh'
          ? '今天最多 ' + max + ' 份，已订 ' + orderedQty + ' 份，剩余 ' + portionsLeft() + ' 份。'
          : 'Max ' + max + ' portions today. Ordered: ' + orderedQty + ', left: ' + portionsLeft() + '.');
        return;
      }

      const requestId = crypto.randomUUID();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '处理中…';

      supabaseClient.rpc('create_order_v2', {
        p_request_id: requestId,
        p_name: name,
        p_quantity: qty,
        p_note: note,
        p_meal_date: getMealDate(),
        p_meal_period: currentPeriod,
        p_payment_method: 'online',
        p_product_id: menu.id,
        p_option_id: selectedOptionId
      }).then(function (res) {
        btn.disabled = false;
        btn.textContent = text[lang].submit;
        if (res.error) {
          console.error(res.error);
          const msg = String(res.error.message || '');
          alert(msg.includes('OUT_OF_STOCK') ? '库存刚刚被抢完，请减少数量或刷新页面。' : text[lang].saveFail);
          loadOrdersToday();
          return;
        }
        const row = res.data && res.data[0];
        if (!row) {
          alert(text[lang].saveFail);
          return;
        }

        window._pendingOrder = {
          request_id: requestId,
          order_code: row.order_code,
          name: name,
          quantity: row.quantity,
          total: row.total,
          meal_type: row.meal_type,
          note: note,
          meal_date: getMealDate(),
          meal_period: currentPeriod
        };

        document.getElementById('payPageOrderId').textContent = '订单号：' + row.order_code;
        document.getElementById('payPageAmount').textContent = '应付：RM ' + row.total;

    }
    function submitCashOrder() {
      const name = document.getElementById('name').value.trim();
      const note = document.getElementById('note').value.trim();
      if (!name) {alert(text[lang].error); return;}
      if (!menu) {alert(text[lang].noMenu); return;}

      const max = maxPortions();
      if (orderedQty + qty > max) {
        alert(lang === 'zh'
          ? '今天最多 ' + max + ' 份，已订 ' + orderedQty + ' 份，剩余 ' + portionsLeft() + ' 份。'
          : 'Max ' + max + ' portions today. Ordered: ' + orderedQty + ', left: ' + portionsLeft() + '.');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '处理中…';

      const requestId = crypto.randomUUID();
      supabaseClient.rpc('create_order_v2', {
        p_request_id: requestId,
        p_name: name,
        p_quantity: qty,
        p_note: note,
        p_meal_date: getMealDate(),
        p_meal_period: currentPeriod,
        p_payment_method: 'cash',
        p_product_id: menu.id,
        p_option_id: selectedOptionId
      }).then(function (res) {
        btn.disabled = false;
        btn.textContent = text[lang].submit;
        if (res.error) {
          console.error(res.error);
          const msg = String(res.error.message || '');
          alert(msg.includes('OUT_OF_STOCK') ? '库存刚刚被抢完，请减少数量或刷新页面。' : text[lang].saveFail);
          loadOrdersToday();
          return;
        }
        const row = res.data && res.data[0];
        if (!row) {
          alert(text[lang].saveFail);
          return;
        }

        document.getElementById('orderCard').style.display = 'none';
        document.getElementById('successCard').style.display = 'block';
        document.getElementById('successCard').classList.add('show');
        document.getElementById('orderId').textContent = row.order_code;
        document.getElementById('successTotal').textContent = 'RM ' + row.total + ' · ' + (lang === 'zh' ? '现金请交给 Yeran' : 'Please pay Yeran in cash');
      });
    }
    function backToOrder() {
      document.getElementById('payCard').style.display = 'none';
      document.getElementById('orderCard').style.display = 'block';
    }

    function onFileSelected(event) {
      const file = event.target.files[0];
      if (!file) return;
      const allowedTypes = ['image/jpeg', 'image/png', 'image/webp'];
      const maxBytes = 5 * 1024 * 1024;
      if (!allowedTypes.includes(file.type)) {
        alert(lang === 'zh' ? '只支持 JPG、PNG、WEBP 图片。' : 'Only JPG, PNG, or WEBP images are allowed.');
        event.target.value = '';
        return;
      }
      if (file.size > maxBytes) {
        alert(lang === 'zh' ? '图片不能超过 5MB。' : 'Image must be 5MB or smaller.');
        event.target.value = '';
        return;
      }
      selectedFile = file;
      document.getElementById('fileName').textContent = escapeHtml(file.name);
      document.getElementById('rechooseBtn').style.display = 'inline-block';

      const reader = new FileReader();
      reader.onload = function (e) {
        document.getElementById('previewImg').src = e.target.result;
        document.getElementById('preview').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    async function submitPayment() {
      if (!selectedFile) {alert(text[lang].needProof); return;}
      const o = window._pendingOrder;
      if (!o || !o.request_id) {
        alert(text[lang].sessionExpired);
        return;
      }

      const btn = document.getElementById('paySubmitBtn');
      btn.disabled = true;
      btn.textContent = text[lang].uploading;

      try {
        const extMap = {
          'image/jpeg': 'jpg',
          'image/png': 'png',
          'image/webp': 'webp'
        };
        const ext = extMap[selectedFile.type];
        if (!ext) throw new Error('INVALID_FILE');

        const path = 'proof_' + o.order_code + '_' + crypto.randomUUID() + '.' + ext;

        const up = await supabaseClient.storage.from('payments').upload(path, selectedFile, {
          contentType: selectedFile.type,
          upsert: false
        });
        if (up.error) throw up.error;

        const attached = await supabaseClient.rpc('attach_payment_proof', {
          p_request_id: o.request_id,
          p_path: path
        });
        if (attached.error) throw attached.error;

        window._pendingOrder = null;
        selectedFile = null;
        document.getElementById('payCard').style.display = 'none';
        document.getElementById('successCard').style.display = 'block';
        document.getElementById('successCard').classList.add('show');
        document.getElementById('orderId').textContent = o.order_code;
        document.getElementById('successTotal').textContent = 'RM ' + o.total + ' · ' + text[lang].pickup;
      } catch (err) {
        console.error(err);
        alert(err && err.message === 'INVALID_FILE' ? '只支持 JPG、PNG、WEBP 图片。' : text[lang].uploadFail);
      } finally {
        btn.disabled = false;
        btn.textContent = text[lang].paySubmitBtn;
      }
    }

    function newOrder() {
      qty = 1;
      selectedFile = null;
      uploadedUrl = '';
      document.getElementById('qty').textContent = '1';
      document.getElementById('name').value = '';
      document.getElementById('note').value = '';
      document.getElementById('fileInput').value = '';
      document.getElementById('fileName').textContent = '';
      document.getElementById('preview').style.display = 'none';
      document.getElementById('rechooseBtn').style.display = 'none';
      const onlineRadio = document.querySelector('input[name="payMethod"][value="online"]');
      if (onlineRadio) onlineRadio.checked = true;
      selectedOptionId = menuOptions.length > 0 ? menuOptions[0].id : null;
      renderOptions();
      onPayMethodChange();
      loadOrdersToday();
      document.getElementById('orderCard').style.display = 'block';
      document.getElementById('successCard').style.display = 'none';
      document.getElementById('successCard').classList.remove('show');
    }

    loadMenu();
    function toggleDark() {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      document.getElementById('darkBtn').textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('darkMode', isDark ? '1' : '0');
    }

    // 页面加载时恢复
    if (localStorage.getItem('darkMode') === '1') {
      document.body.classList.add('dark');
      document.getElementById('darkBtn').textContent = '☀️';
    }
    setLang('zh');
    function scrollToTop() {
      window.scrollTo({top: 0, behavior: 'smooth'});
    }
  </script>
</body>
