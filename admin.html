<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  
  <link rel="icon" type="image/png" href="/icons/admin-orders-text.svg?v=6">
  <link rel="apple-touch-icon" type="image/png" sizes="256x256" href="/icons/admin-orders.png?v=5">
  <meta name="theme-color" content="#f7f5f0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YeranFood｜订单</title>
  <style>
    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f7f5f0;
      color: #222
    }

    header {
      background: #111;
      color: #fff;
      padding: 20px;
      text-align: center
    }

    header h1 {
      margin: 0;
      font-size: 26px
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 16px
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px #0000000d
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 12px
    }

    button {
      padding: 12px 24px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer
    }

    button:hover {
      opacity: .85
    }

    .summary {
      display: flex;
      gap: 16px;
      flex-wrap: wrap
    }

    .summary>div {
      flex: 1;
      min-width: 140px;
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 3px 12px #0000000d
    }

    .summary .num {
      font-size: 32px;
      font-weight: 800;
      color: #111
    }

    .summary .lbl {
      font-size: 14px;
      color: #666;
      margin-top: 4px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px #0000000d
    }

    th,
    td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid #eee;
      font-size: 14px
    }

    th {
      background: #fafafa;
      font-weight: 700;
      color: #555
    }

    td.note {
      color: #888;
      font-size: 13px
    }

    .tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700
    }

    .tag.meat {
      background: #ffe4e1;
      color: #c0392b
    }

    .tag.veg {
      background: #e8f5e9;
      color: #2e7d32
    }

    .hidden {
      display: none
    }

    .err {
      color: #c0392b;
      margin-top: 10px
    }

    h2 {
      margin-top: 0
    }

    .noorders {
      text-align: center;
      color: #999;
      padding: 40px
    }
  
    /* ===== 全局 UI 稳定性增强 ===== */
    button, input, textarea, select { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid rgba(26,115,232,.28);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
    @media (max-width: 700px) {
      button { touch-action: manipulation; }
      #bottomNav {
        padding-bottom: max(8px, env(safe-area-inset-bottom));
      }
      .container { padding: 0 10px; margin-top: 12px; }
      .card { padding: 14px; border-radius: 12px; }
      #main > .card { margin-top: 12px; }
      .kitchen-top-actions {
        float:none !important;
        display:grid !important;
        grid-template-columns:1fr 1fr;
        gap:8px;
        width:100%;
        margin:0 0 12px !important;
      }
      .kitchen-top-actions button {
        width:100%;
        min-width:0;
        padding:10px 8px !important;
        font-size:14px !important;
      }
      .period-switch {
        display:flex;
        gap:8px;
        width:100%;
      }
      .period-switch button {
        flex:1;
        margin-left:0 !important;
        width:0;
        padding:12px 8px !important;
      }
      .summary { gap:8px; }
      .summary>div { min-width: calc(50% - 4px); padding:12px 8px; }
      .summary .num { font-size:24px; }
      .kitchen-refresh { min-height:40px; padding:8px 12px !important; }
      .kitchen-table { display:none; }
      .kitchen-cards { display:grid !important; gap:10px; }
    }
    .kitchen-cards { display:none; }
    .kitchen-order {
      border:1px solid #e5e5e5;
      border-radius:12px;
      padding:13px;
      background:#fff;
    }
    .kitchen-order-top {
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
    }
    .kitchen-order-code { font-weight:800; font-size:17px; }
    .kitchen-order-name { font-size:15px; font-weight:700; margin-top:4px; }
    .kitchen-order-meta { color:#777; font-size:13px; margin-top:8px; line-height:1.6; }
    .kitchen-order-note { margin-top:8px; padding:8px 10px; background:#f7f7f7; border-radius:8px; font-size:13px; color:#666; }


  
    /* ===== YeranFood orange-red operations dashboard ===== */
    :root { --yf-accent:#ed4632; --yf-accent-dark:#c92f29; --yf-accent-soft:#fff0e9; --yf-line:#f0dfd8; --yf-ink:#29201e; }
    body { background:radial-gradient(ellipse at 10% 0%,rgba(255,214,192,.35),transparent 28%),#fff8f4; color:var(--yf-ink); -webkit-font-smoothing:antialiased; }
    header { background:linear-gradient(115deg,#b92525,#ed4632 58%,#ff743b); padding:22px 20px; box-shadow:0 8px 24px rgba(185,37,37,.15); }
    header h1 { letter-spacing:-.4px; }
    header h1:before { content:"✦"; color:#ffe1a7; margin-right:9px; }
    .container { max-width:1120px; }
    .card { border:1px solid var(--yf-line); border-radius:18px; box-shadow:0 8px 24px rgba(96,43,27,.055); }
    .card h2 { color:#38221d; letter-spacing:-.3px; }
    button { background:linear-gradient(110deg,#d92f2d,#f04b35 65%,#ff713b); box-shadow:0 4px 12px rgba(205,48,39,.13); transition:transform .14s ease,box-shadow .14s ease,filter .14s ease; }
    button:hover { opacity:1; filter:saturate(1.08); box-shadow:0 7px 16px rgba(205,48,39,.18); }
    button:active { transform:scale(.98); }
    .summary>div { border:1px solid #f1ddd5; border-radius:16px; background:linear-gradient(145deg,#fff,#fff7f2); }
    .summary .num { color:#df3c2e; }
    table { border-radius:14px; border:1px solid var(--yf-line); }
    th { background:#fff0e9; color:#9d392d; }
    td,th { border-bottom-color:#f4e7e1; }
    tbody tr:hover { background:#fff8f4; }
    .tag.meat { background:#ffe2d9; color:#b52d27; }
    input:focus,textarea:focus,select:focus { border-color:#f16a50; outline:none; box-shadow:0 0 0 3px rgba(240,75,53,.11); }
    .kitchen-order { border-color:#f0d9d0; border-radius:15px; box-shadow:0 4px 12px rgba(96,43,27,.04); }
    .kitchen-order-note { background:#fff2eb; color:#8a5145; }
    .noorders { background:#fff8f4; border-radius:14px; }
    @media (max-width:700px) {
      header { padding:18px 14px; }
      .container { padding-left:12px; padding-right:12px; }
      .card { border-radius:16px; }
      .summary>div { min-width:calc(50% - 5px); }
      .summary .num { color:#df3c2e; }
      .kitchen-order { padding:14px; }
    }

   
    /* Apple-inspired neutral palette for staff/admin screens */
    :root {
      color-scheme: light;
      --staff-bg: #f5f5f7;
      --staff-surface: #ffffff;
      --staff-text: #1d1d1f;
      --staff-muted: #6e6e73;
      --staff-line: #e5e5ea;
      --staff-button: #1d1d1f;
    }
    body {
      background: var(--staff-bg) !important;
      color: var(--staff-text) !important;
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: var(--staff-bg) !important;
      background-image: none !important;
      color: var(--staff-text) !important;
      border-bottom: 1px solid var(--staff-line);
      box-shadow: none !important;
    }
    header h1, header h2, header p { color: var(--staff-text); }
    .card, .summary > div, .panel, .stat-card, .order-card {
      background: var(--staff-surface) !important;
      color: var(--staff-text) !important;
      border: 1px solid var(--staff-line);
      border-radius: 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.035) !important;
    }
    button, button.primary, .primary, input[type="submit"] {
      background: var(--staff-button) !important;
      color: #fff !important;
      border: 1px solid var(--staff-button) !important;
      border-radius: 12px;
      box-shadow: none !important;
    }
    button:hover, button.primary:hover, .primary:hover, input[type="submit"]:hover {
      background: #333336 !important;
    }
    input, textarea, select {
      background: #fff !important;
      color: var(--staff-text) !important;
      border: 1px solid #d2d2d7 !important;
      border-radius: 10px;
    }
    input:focus, textarea:focus, select:focus {
      outline: 2px solid #86868b;
      outline-offset: 1px;
    }
    table th { background: #f5f5f7; color: #424245; }
    table td, table th { border-color: var(--staff-line); }
    .muted, .hint, .subtitle, small { color: var(--staff-muted); }
    .err, .error { color: #b42318; }

  
    /* ===== Admin dashboard UX refresh: calm, compact, mobile-first ===== */
    :root {
      --admin-bg:#f5f5f7;
      --admin-surface:#fff;
      --admin-ink:#1d1d1f;
      --admin-muted:#6e6e73;
      --admin-line:#e5e5ea;
      --admin-accent:#0071e3;
      --admin-accent-soft:#eaf3ff;
    }
    html { background:var(--admin-bg); scroll-behavior:smooth; }
    body {
      background:var(--admin-bg) !important;
      color:var(--admin-ink) !important;
      font-size:15px;
      line-height:1.5;
    }
    header {
      position:relative;
      padding:26px 20px 24px !important;
      text-align:left !important;
      background:var(--admin-bg) !important;
      border-bottom:1px solid var(--admin-line);
      box-shadow:none !important;
    }
    header h1 {
      max-width:1120px;
      margin:0 auto !important;
      font-size:clamp(24px,3vw,30px) !important;
      font-weight:750;
      letter-spacing:-.8px !important;
      color:var(--admin-ink) !important;
    }
    header h1:before { content:none !important; }
    .container { max-width:1120px !important; margin:24px auto 48px !important; padding:0 22px !important; }
    .card, #adminLogin {
      padding:22px !important;
      margin-bottom:18px !important;
      background:var(--admin-surface) !important;
      border:1px solid var(--admin-line) !important;
      border-radius:18px !important;
      box-shadow:0 2px 8px rgba(0,0,0,.025) !important;
    }
    h2 { color:var(--admin-ink) !important; font-size:19px; letter-spacing:-.35px; font-weight:700; }
    #adminLogin { max-width:440px; margin:40px auto !important; }
    #adminLogin input { display:block; margin:10px 0 14px; }
    input, textarea, select {
      min-height:44px;
      padding:12px 14px !important;
      background:#fbfbfd !important;
      border:1px solid #d2d2d7 !important;
      border-radius:12px !important;
      color:var(--admin-ink) !important;
      box-shadow:none !important;
    }
    input:focus, textarea:focus, select:focus {
      border-color:#0071e3 !important;
      outline:3px solid rgba(0,113,227,.13) !important;
      outline-offset:0;
    }
    button {
      min-height:40px;
      padding:10px 15px !important;
      border:1px solid var(--admin-ink) !important;
      border-radius:11px !important;
      background:var(--admin-ink) !important;
      color:#fff !important;
      box-shadow:none !important;
      font-size:14px !important;
      font-weight:650 !important;
      transition:background .15s ease, transform .15s ease !important;
    }
    button:hover { background:#3a3a3c !important; filter:none !important; box-shadow:none !important; }
    button:active { transform:scale(.985); }
    .period-switch {
      display:flex;
      gap:8px;
      padding:5px;
      width:max-content;
      max-width:100%;
      border:1px solid var(--admin-line);
      border-radius:14px;
      background:#e9e9ed;
    }
    .period-switch button {
      min-width:88px;
      margin:0 !important;
      border:1px solid transparent !important;
      background:transparent !important;
      color:#6e6e73 !important;
      box-shadow:none !important;
    }
    .period-switch button.primary,
    .period-switch button[aria-pressed="true"] {
      background:#fff !important;
      color:var(--admin-ink) !important;
      border-color:#dedee3 !important;
      box-shadow:0 1px 3px rgba(0,0,0,.06) !important;
    }
    .summary { display:grid !important; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px !important; margin:18px 0; }
    .summary>div {
      min-width:0 !important;
      padding:18px !important;
      text-align:left !important;
      background:#fff !important;
      border:1px solid var(--admin-line) !important;
      border-radius:16px !important;
      box-shadow:none !important;
    }
    .summary .num { color:var(--admin-ink) !important; font-size:30px !important; letter-spacing:-.8px; }
    .summary .lbl { color:var(--admin-muted) !important; font-size:13px !important; }
    table { box-shadow:none !important; border:1px solid var(--admin-line); }
    th { background:#f5f5f7 !important; color:#424245 !important; }
    th,td { padding:13px 12px !important; border-bottom-color:var(--admin-line) !important; }
    tbody tr:hover { background:#f8f8fa !important; }
    .kitchen-order {
      padding:16px !important;
      background:#fff !important;
      border:1px solid var(--admin-line) !important;
      border-radius:15px !important;
      box-shadow:none !important;
    }
    .kitchen-order-code { color:var(--admin-ink); letter-spacing:-.2px; }
    .kitchen-order-meta { color:var(--admin-muted) !important; }
    .kitchen-order-note { background:#f5f5f7 !important; color:#424245 !important; border-radius:10px !important; }
    .noorders { background:transparent !important; color:var(--admin-muted) !important; }
    .kitchen-top-actions { gap:8px !important; }
    #kitchenPushBtn { background:#fff !important; color:var(--admin-ink) !important; border-color:var(--admin-line) !important; }
    #main > .card h2 { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .kitchen-refresh { flex-shrink:0; }
    @media (max-width:800px) {
      .container { margin-top:14px !important; padding:0 14px !important; }
      header { padding:22px 16px !important; }
      .summary { grid-template-columns:repeat(2,minmax(0,1fr)) !important; gap:9px !important; }
      .summary>div { padding:14px !important; }
      .summary .num { font-size:25px !important; }
      .card, #adminLogin { padding:16px !important; border-radius:16px !important; }
      .period-switch { width:100%; }
      .period-switch button { flex:1; min-width:0; }
      #main > .card h2 { align-items:flex-start; }
      .kitchen-order-top { gap:8px; }
    }
    @media (max-width:380px) {
      .summary .num { font-size:22px !important; }
      .kitchen-top-actions { grid-template-columns:1fr !important; }
    }

  

  
    /* Mobile app-style navigation for the kitchen */
    body { background:#f5f5f7 !important; color:#1d1d1f !important; padding-bottom:calc(82px + env(safe-area-inset-bottom)); }
    header { background:rgba(255,255,255,.94) !important; color:#1d1d1f !important; text-align:left !important; padding:18px 20px !important; border-bottom:1px solid #e5e5ea; backdrop-filter:blur(18px); }
    header h1 { font-size:21px !important; letter-spacing:-.4px; }
    .container { max-width:860px !important; margin:16px auto 28px !important; }
    #main > .card { border:1px solid #e5e5ea !important; border-radius:20px !important; box-shadow:0 2px 12px #00000005 !important; padding:22px !important; }
    #main > .card h2 { font-size:20px; letter-spacing:-.3px; }
    .summary > div { border:1px solid #e5e5ea !important; border-radius:18px !important; box-shadow:0 2px 10px #00000004 !important; }
    .period-switch { padding:5px !important; border:1px solid #e5e5ea; border-radius:14px; background:#fff; gap:5px !important; }
    .period-switch button { border-radius:10px !important; min-height:42px; }
    .kitchen-top-actions button { border-radius:11px !important; min-height:40px; }
    #kitchenPushBtn { background:#fff !important; }
    .kitchen-refresh { border-radius:9px !important; min-height:34px; }
    .kitchen-bottom-nav { position:fixed; left:0; right:0; bottom:0; z-index:100; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; padding:8px 16px calc(8px + env(safe-area-inset-bottom)); border-top:1px solid #e5e5ea; background:rgba(255,255,255,.95); box-shadow:0 -8px 28px #0000000a; backdrop-filter:blur(22px); }
    .kitchen-bottom-nav button { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:52px; border:0; border-radius:12px; background:transparent; color:#77777c; font:600 11px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; cursor:pointer; }
    .kitchen-bottom-nav button span:first-child { font-size:21px; line-height:1; font-weight:400; }
    /* 未选中菜单提高文字对比度，保持液态玻璃风格 */
    .kitchen-bottom-nav button,
    .kitchen-bottom-nav button:hover,
    .kitchen-bottom-nav button:active {
      color: #5b5670 !important;
    }
    .kitchen-bottom-nav button span {
      color: inherit !important;
    }
    .kitchen-bottom-nav button.active { background:#f0f0f3; color:#1d1d1f; }
    .kitchen-bottom-nav button:focus-visible { outline:2px solid #007aff; outline-offset:2px; }
    #main > .card[hidden], #main > [hidden] { display:none !important; }
    @media(max-width:700px) {
      body { padding-bottom:calc(80px + env(safe-area-inset-bottom)); }
      header { padding:16px !important; }
      .container { margin-top:12px !important; padding:0 12px !important; }
      #main > .card { padding:18px 15px !important; border-radius:18px !important; }
      .summary { gap:9px !important; }
      .summary > div { padding:16px 13px !important; }
      .period-switch button { padding:11px 6px !important; font-size:14px !important; }
    }

  

    /* YeranFood A 方案：轻量蓝紫液态玻璃 */
    :root { --yf-glass-border: rgba(116, 112, 255, .22); --yf-glass-shadow: 0 12px 32px rgba(86, 83, 210, .10); }
    body { background: radial-gradient(ellipse at 12% 0%, rgba(190, 181, 255, .30), transparent 42%), linear-gradient(135deg, #f8f8ff, #eef2ff); }
    header { background: rgba(255,255,255,.72); color: #29245f; border-bottom: 1px solid var(--yf-glass-border); box-shadow: 0 4px 24px rgba(92,88,210,.08); backdrop-filter: blur(18px) saturate(145%); -webkit-backdrop-filter: blur(18px) saturate(145%); }
    .card, .summary>div, .order-card, .kitchen-order, #orderCard, #adminLogin, #loginCard, #main>.card { background: rgba(255,255,255,.76); border: 1px solid rgba(255,255,255,.92); box-shadow: var(--yf-glass-shadow); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); }
    input, select, textarea { background: rgba(255,255,255,.78); border: 1px solid var(--yf-glass-border); }
    button.primary, .primary, button:not([class]) { background-image: linear-gradient(135deg, #786bff, #5747e8); box-shadow: 0 6px 16px rgba(98,82,235,.22); }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(105,91,245,.30); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

  
    /* ===== Liquid Glass: admin / kitchen dashboard only ===== */
    :root {
      --glass-bg: rgba(255,255,255,.66);
      --glass-bg-strong: rgba(255,255,255,.82);
      --glass-border: rgba(255,255,255,.82);
      --glass-shadow: 0 10px 34px rgba(31,41,55,.075), inset 0 1px 0 rgba(255,255,255,.9);
      --glass-blur: 18px;
    }
    html, body {
      background:
        radial-gradient(ellipse at 8% 0%, rgba(190,216,255,.5), transparent 34%),
        radial-gradient(ellipse at 96% 18%, rgba(255,210,226,.38), transparent 32%),
        linear-gradient(145deg,#f5f7fb 0%,#f2f3f8 48%,#f8f5f4 100%) !important;
      background-attachment: fixed;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 18px 20px !important;
      background: rgba(248,249,252,.72) !important;
      background-image: none !important;
      border-bottom: 1px solid rgba(255,255,255,.8);
      box-shadow: 0 6px 24px rgba(31,41,55,.045) !important;
      -webkit-backdrop-filter: saturate(180%) blur(var(--glass-blur));
      backdrop-filter: saturate(180%) blur(var(--glass-blur));
    }
    header h1 { letter-spacing: -.55px; }
    .container { padding-bottom: max(24px, env(safe-area-inset-bottom)); }
    .card, .summary > div, .panel, .stat-card, .order-card {
      background: var(--glass-bg) !important;
      border: 1px solid var(--glass-border) !important;
      border-radius: 20px !important;
      box-shadow: var(--glass-shadow) !important;
      -webkit-backdrop-filter: saturate(170%) blur(var(--glass-blur));
      backdrop-filter: saturate(170%) blur(var(--glass-blur));
    }
    .summary > div { background: var(--glass-bg-strong) !important; }
    .summary .num { letter-spacing: -1px; }

  <script>
    const SUPABASE_URL = 'https://kbzspuxrwsuxoyozmvjb.supabase.co';

    const KITCHEN_VAPID_PUBLIC_KEY = 'BLHcf3kJydxitQ0-FUC9zLUIrVVfevE58TjcjNqHFCUSfvx2GX0JptQCyzopH5RSxoSmiZYAuJSP7mCURXJdHtU';

    function base64UrlToUint8Array(base64UrlData) {
      const padding = '='.repeat((4 - base64UrlData.length % 4) % 4);
      const base64 = (base64UrlData + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map(ch => ch.charCodeAt(0)));
    }

    async function refreshKitchenPushButton() {
      const btn = document.getElementById('kitchenPushBtn');
      if (!btn) return;
      if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) {
        btn.textContent = '此设备不支持通知';
        btn.disabled = true;
        return;
      }
      try {
        const registration = await navigator.serviceWorker.register('/sw.js');
        const subscription = await registration.pushManager.getSubscription();
        if (subscription && Notification.permission === 'granted') {
          btn.textContent = '🔔 新订单提醒已开启';
        } else if (Notification.permission === 'denied') {
          btn.textContent = '通知已关闭';
        } else {
          btn.textContent = '🔔 开启新订单提醒';
        }
      } catch (err) {
        console.error('检查厨师端通知失败:', err);
      }
    }

    async function enableKitchenPush() {
      const btn = document.getElementById('kitchenPushBtn');
      if (!btn) return;
      try {
        if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) {
          alert('这个设备或浏览器不支持推送通知。');
          return;
        }
        btn.disabled = true;
        btn.textContent = '开启中…';
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          alert('你需要允许浏览器通知权限，厨师端才能收到新订单提醒。');
          await refreshKitchenPushButton();
          return;
        }
        const registration = await navigator.serviceWorker.register('/sw.js');
        const existing = await registration.pushManager.getSubscription();
        const subscription = existing || await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: base64UrlToUint8Array(KITCHEN_VAPID_PUBLIC_KEY)
        });
        const json = subscription.toJSON();
        const endpoint = json.endpoint;
        const p256dh = json.keys && json.keys.p256dh;
        const auth = json.keys && json.keys.auth;
        if (!endpoint || !p256dh || !auth) throw new Error('INVALID_PUSH_SUBSCRIPTION');

        const { error } = await supabaseClient.rpc('save_kitchen_push_subscription', {
          p_endpoint: endpoint,
          p_p256dh: p256dh,
          p_auth: auth
        });
        if (error) throw error;
        btn.textContent = '🔔 新订单提醒已开启';
      } catch (err) {
        console.error('开启厨师端通知失败:', err);
        alert('开启通知失败，请检查浏览器通知权限后重试。');
        await refreshKitchenPushButton();
      } finally {
        btn.disabled = false;
      }
    }

    async function initKitchenPush() {
      await refreshKitchenPushButton();
    }

    async function adminLogin() {
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPw').value;
      const msg = document.getElementById('adminLoginMsg');
      if (!email || !password) {
        msg.textContent = '请输入邮箱和密码';
        return;
      }
      msg.textContent = '登录中…';
      try {
        const {data, error} = await supabaseClient.auth.signInWithPassword({email, password});
        if (error || !data.session) {
          console.error(error);
          msg.textContent = '登录失败，请检查账号或密码';
          return;
        }
        showAdmin();
      } catch (error) {
        console.error('管理员登录请求失败:', error);
        msg.textContent = '网络异常，请检查连接后重试';
      }
    }

    let adminViewReady = false;

    function showAdmin() {
      if (adminViewReady) return;
      adminViewReady = true;
      applyFridayLunchVisibility();

      document.getElementById('adminLogin').style.display = 'none';
      document.getElementById('main').style.display = 'block';
      setKitchenPage('orders');
      loadOrders();
      loadFeedback();
      initKitchenPush();
    }

    function setKitchenPage(page) {
      const feedback = document.getElementById('kitchenFeedbackPage');
      const period = document.querySelector('#main .period-switch');
      const summary = document.getElementById('summaryBox');
      const orderCard = document.getElementById('ordersBox')?.closest('.card');
      const isFeedback = page === 'feedback';
      if (feedback) feedback.hidden = !isFeedback;
      [period, summary, orderCard].forEach(function(el) {
        if (el) el.hidden = isFeedback;
      });
      document.querySelectorAll('.kitchen-bottom-nav [data-kitchen-page]').forEach(function(button) {
        const active = button.dataset.kitchenPage === (isFeedback ? 'feedback' : 'orders');
        button.classList.toggle('active', active);
        button.setAttribute('aria-current', active ? 'page' : 'false');
      });
      window.scrollTo({top: 0, behavior: 'auto'});
    }

    async function adminLogout() {
      await supabaseClient.auth.signOut();
      location.reload();
    }

    async function restoreAdminSession() {
      const {data} = await supabaseClient.auth.getSession();
      if (data && data.session) showAdmin();
    }

    supabaseClient.auth.onAuthStateChange(function (event, session) {
      if (event === 'SIGNED_IN' && session) showAdmin();
      if (event === 'SIGNED_OUT') location.reload();
    });



    // Frontend hardening: never inject database/user text into HTML without escaping it.
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }


    function safeErrorMessage(error, fallback) {
      console.error(error);
      return fallback || '操作失败，请稍后重试。';
    }

    function setButtonBusy(btn, busy, busyText, normalText) {
      if (!btn) return;
      btn.disabled = !!busy;
      btn.textContent = busy ? busyText : normalText;
    }

    // SECURITY NOTE:
    // The publishable Supabase key is safe to ship in frontend code only when
    // Row Level Security (RLS) policies protect every table/storage action.
    // Never put a Supabase service_role key or a real admin password in this file.




    let currentPeriod = 'lunch';
    let ordersLoadSeq = 0;

    function isTargetMealDateFriday() {
      return getMalaysiaDateDay(getMealDate()) === 5;
    }

    function applyFridayLunchVisibility() {
      const lunchButton = document.getElementById('btnLunch');
      const isFriday = isTargetMealDateFriday();
      if (lunchButton) {
        lunchButton.hidden = isFriday;
        if (isFriday) lunchButton.style.setProperty('display', 'none', 'important');
        else lunchButton.style.removeProperty('display');
      }
      if (isFriday && currentPeriod === 'lunch') switchPeriod('breakfast');
    }

    function switchPeriod(p) {
      if (p === 'lunch' && isTargetMealDateFriday()) {
        applyFridayLunchVisibility();
        return;
      }
      currentPeriod = p;
      document.getElementById('btnLunch').className = p === 'lunch' ? 'primary' : '';
      document.getElementById('btnLunch').style.background = p === 'lunch' ? '#111' : '#eee';
      document.getElementById('btnLunch').style.color = p === 'lunch' ? '#fff' : '#333';
      document.getElementById('btnBreakfast').className = p === 'breakfast' ? 'primary' : '';
      document.getElementById('btnBreakfast').style.background = p === 'breakfast' ? '#111' : '#eee';
      document.getElementById('btnBreakfast').style.color = p === 'breakfast' ? '#fff' : '#333';
      document.getElementById('btnDrink').className = p === 'drink' ? 'primary' : '';
      document.getElementById('btnDrink').style.background = p === 'drink' ? '#111' : '#eee';
      document.getElementById('btnDrink').style.color = p === 'drink' ? '#fff' : '#333';
      loadOrders();
    }
    function fmtTime(t) {
      const d = new Date(t);
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return hh + ':' + mm;
    }

    function loadFeedback() {
      return supabaseClient.from('feedback').select('*').eq('approved', true).order('created_at', {ascending: false}).then(function (res) {
        if (res.error) {console.error(res.error); return;}
        const list = res.data || [];
        if (!list.length) {
          document.getElementById('feedbackBox').innerHTML = '<div class="noorders">暂无反馈</div>';
          return;
        }
        let html = '<table><thead><tr><th>时间</th><th>姓名</th><th>内容</th></tr></thead><tbody>';
        list.forEach(function (f) {
          html += '<tr>' +
            '<td>' + fmtTime(f.created_at) + '</td>' +
            '<td>' + escapeHtml(f.name || '') + '</td>' +
            '<td>' + escapeHtml(f.content || '') + '</td>' +
            '</tr>';
        });
        html += '</tbody></table>';
        document.getElementById('feedbackBox').innerHTML = html;
      });
    }
    function getMalaysiaNowParts() {
      const parts = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Asia/Kuala_Lumpur', year: 'numeric', month: '2-digit',
        day: '2-digit', hour: '2-digit', hourCycle: 'h23', weekday: 'short'
      }).formatToParts(new Date());
      const values = {};
      parts.forEach(function (part) {
        if (part.type !== 'literal') values[part.type] = part.value;
      });
      return { year: Number(values.year), month: Number(values.month), day: Number(values.day), hour: Number(values.hour), weekday: values.weekday };
    }

    function getMalaysiaDateDay(dateString) {
      const p = dateString.split('-').map(Number);
      return new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay();
    }

    function getMealDate() {
      const now = getMalaysiaNowParts();
      const date = new Date(Date.UTC(now.year, now.month - 1, now.day));
      if (now.hour >= 15) date.setUTCDate(date.getUTCDate() + 1);
      return date.getUTCFullYear() + '-' + String(date.getUTCMonth() + 1).padStart(2, '0') + '-' + String(date.getUTCDate()).padStart(2, '0');
    }

    function refreshKitchen(btn) {
      if (btn) {
        btn.disabled = true;
        btn.textContent = '刷新中…';
      }
      Promise.all([loadOrders(), loadFeedback()]).finally(function () {
        if (btn) {
          btn.disabled = false;
          btn.textContent = '🔄 刷新';
        }
      });
    }

    function loadOrders() {
      const loadSeq = ++ordersLoadSeq;
      const targetDate = getMealDate();
      return supabaseClient.from('orders')
        .select('*')
        .eq('meal_date', targetDate)
        .eq('meal_period', currentPeriod)
        .order('created_at', {ascending: true})
        .then(function (res) {
          if (loadSeq !== ordersLoadSeq) return;
          if (res.error) {
            document.getElementById('ordersBox').innerHTML =
              '<div class="noorders">读取失败，请稍后重试。</div>';
            return;
          }
          renderOrders(res.data || []);
        });
    }
    let currentOrders = [];

    function renderOrders(orders) {
      currentOrders = (orders || []).slice().sort(function (a, b) {
        return new Date(b.created_at) - new Date(a.created_at);
      });
      const counts = {};
      currentOrders.forEach(function (o) {
        const k = o.meal_type || '未知';
        counts[k] = (counts[k] || 0) + Number(o.quantity || 0);
      });
      let summaryHtml = '';
      Object.keys(counts).forEach(function (k) {
        summaryHtml += '<div><div class="num">' + counts[k] + '</div><div class="lbl">' + escapeHtml(k) + '</div></div>';
      });
      const totalQty = currentOrders.reduce(function (s, o) { return s + Number(o.quantity || 0); }, 0);
      summaryHtml += '<div><div class="num">' + totalQty + '</div><div class="lbl">总份数</div></div>';
      document.getElementById('summaryBox').innerHTML = summaryHtml;
      renderOrderRows(currentOrders);
    }

    function renderOrderRows(orders) {
      if (!orders.length) {
        document.getElementById('ordersBox').innerHTML = '<div class="noorders">今天还没有订单</div>';
        return;
      }
      let html = '<div class="kitchen-table"><table><thead><tr>' +
        '<th>时间</th><th>订单号</th><th>姓名</th><th>类型</th><th>数量</th><th>付款</th><th>备注</th>' +
        '</tr></thead><tbody>';
      orders.forEach(function (o) {
        const mealTag = '<span class="tag">' + escapeHtml(o.meal_type || '—') + '</span>';
        const paidTag = o.paid
          ? '<span class="payment-pill is-paid">已付款</span>'
          : '<span class="payment-pill is-unpaid">未付款</span>';
        html += '<tr>' +
          '<td>' + fmtTime(o.created_at) + '</td>' +
          '<td><strong>' + escapeHtml(o.order_code || '—') + '</strong></td>' +
          '<td>' + escapeHtml(o.name || '未填写姓名') + '</td>' +
          '<td>' + mealTag + '</td>' +
          '<td><strong>' + Number(o.quantity || 0) + '</strong></td>' +
          '<td>' + paidTag + '</td>' +
          '<td class="note">' + escapeHtml(o.note || '—') + '</td>' +
          '</tr>';
      });
      html += '</tbody></table></div><div class="kitchen-cards">';
      orders.forEach(function (o) {
        const note = String(o.note || '').trim();
        html += '<div class="kitchen-order">' +
          '<div class="kitchen-order-top"><div><div class="kitchen-order-code">' + escapeHtml(o.order_code || '—') + '</div>' +
          '<div class="kitchen-order-name">' + escapeHtml(o.name || '未填写姓名') + '</div></div>' +
          '<span class="payment-pill ' + (o.paid ? 'is-paid' : 'is-unpaid') + '">' + (o.paid ? '已付款' : '未付款') + '</span></div>' +
          '<div class="kitchen-order-meta">' + fmtTime(o.created_at) + ' · ' + escapeHtml(o.meal_type || '—') + ' · <strong>' + Number(o.quantity || 0) + ' 份</strong></div>' +
          (note ? '<div class="kitchen-order-note">备注：' + escapeHtml(note) + '</div>' : '') +
          '</div>';
      });
      html += '</div>';
      document.getElementById('ordersBox').innerHTML = html;
    }
    restoreAdminSession();
    // 每 30 秒自动刷新
    setInterval(function () {
      loadOrders();
      loadFeedback();
    }, 30000);
  </script>
</body>

</html>
