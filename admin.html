<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YeranFood｜订单</title>
  <style>
    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f7f5f0;
      color: #222
    }

    header {
      background: #111;
      color: #fff;
      padding: 20px;
      text-align: center
    }

    header h1 {
      margin: 0;
      font-size: 26px
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 16px
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px #0000000d
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 12px
    }

    button {
      padding: 12px 24px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer
    }

    button:hover {
      opacity: .85
    }

    .summary {
      display: flex;
      gap: 16px;
      flex-wrap: wrap
    }

    .summary>div {
      flex: 1;
      min-width: 140px;
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 3px 12px #0000000d
    }

    .summary .num {
      font-size: 32px;
      font-weight: 800;
      color: #111
    }

    .summary .lbl {
      font-size: 14px;
      color: #666;
      margin-top: 4px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px #0000000d
    }

    th,
    td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid #eee;
      font-size: 14px
    }

    th {
      background: #fafafa;
      font-weight: 700;
      color: #555
    }

    td.note {
      color: #888;
      font-size: 13px
    }

    .tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700
    }

    .tag.meat {
      background: #ffe4e1;
      color: #c0392b
    }

    .tag.veg {
      background: #e8f5e9;
      color: #2e7d32
    }

    .hidden {
      display: none
    }

    .err {
      color: #c0392b;
      margin-top: 10px
    }

    h2 {
      margin-top: 0
    }

    .noorders {
      text-align: center;
      color: #999;
      padding: 40px
    }
  
    /* ===== 全局 UI 稳定性增强 ===== */
    button, input, textarea, select { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid rgba(26,115,232,.28);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
    @media (max-width: 700px) {
      button { touch-action: manipulation; }
      #bottomNav {
        padding-bottom: max(8px, env(safe-area-inset-bottom));
      }
    }

  </style>
</head>

<body>

  <header>
    <h1>YeranFood · 订单</h1>
  </header>

  <main class="container">

    <section class="card" id="adminLogin">
      <h2>管理员登录</h2>
      <input type="email" id="adminEmail" placeholder="管理员邮箱" autocomplete="username">
      <input type="password" id="adminPw" placeholder="密码" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')adminLogin()">
      <button onclick="adminLogin()">登录</button>
      <div id="adminLoginMsg" style="margin-top:10px;color:#c0392b"></div>
    </section>


    <!-- 订单页 -->
    <section id="main" style="display:none">
      <button onclick="adminLogout()" style="float:right;margin-bottom:12px">退出登录</button>
      <div style="margin-bottom:16px">
        <button id="btnLunch" class="primary" onclick="switchPeriod('lunch')">午餐</button>
        <button id="btnBreakfast" onclick="switchPeriod('breakfast')"
          style="margin-left:8px;padding:12px 24px;border:0;border-radius:10px;background:#eee;color:#333;font-size:16px;font-weight:700;cursor:pointer">早餐</button>
      </div>
      <div class="summary" id="summaryBox"></div>

      <div class="card" style="margin-top:16px">
        <h2>订单列表 <button onclick="loadOrders();loadFeedback()"
            style="float:right;font-size:13px;padding:4px 10px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer">🔄
            刷新</button></h2>
        <div id="ordersBox">
          <div class="noorders">加载中…</div>
        </div>
      </div>

      <div class="card">
        <h2>意见反馈 <button onclick="loadFeedback()"
            style="float:right;font-size:13px;padding:4px 10px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer">🔄
            刷新</button></h2>
        <div id="feedbackBox">
          <div class="noorders">加载中…</div>
        </div>
      </div>
    </section>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://kbzspuxrwsuxoyozmvjb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_oC0S_vWgBt_X8N4Xu4cG4g_ekhGwKXB';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function adminLogin() {
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPw').value;
      const msg = document.getElementById('adminLoginMsg');
      if (!email || !password) {
        msg.textContent = '请输入邮箱和密码';
        return;
      }
      msg.textContent = '登录中…';
      const {data, error} = await supabaseClient.auth.signInWithPassword({email, password});
      if (error || !data.session) {
        console.error(error);
        msg.textContent = '登录失败，请检查账号或密码';
        return;
      }
      showAdmin();
    }

    function showAdmin() {
      document.getElementById('adminLogin').style.display = 'none';
      document.getElementById('main').style.display = 'block';
      loadOrders();
      loadFeedback();
    }

    async function adminLogout() {
      await supabaseClient.auth.signOut();
      location.reload();
    }

    async function restoreAdminSession() {
      const {data} = await supabaseClient.auth.getSession();
      if (data && data.session) showAdmin();
    }

    supabaseClient.auth.onAuthStateChange(function (event, session) {
      if (event === 'SIGNED_IN' && session) showAdmin();
      if (event === 'SIGNED_OUT') location.reload();
    });



    // Frontend hardening: never inject database/user text into HTML without escaping it.
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }


    function safeErrorMessage(error, fallback) {
      console.error(error);
      return fallback || '操作失败，请稍后重试。';
    }

    function setButtonBusy(btn, busy, busyText, normalText) {
      if (!btn) return;
      btn.disabled = !!busy;
      btn.textContent = busy ? busyText : normalText;
    }

    // SECURITY NOTE:
    // The publishable Supabase key is safe to ship in frontend code only when
    // Row Level Security (RLS) policies protect every table/storage action.
    // Never put a Supabase service_role key or a real admin password in this file.




    let currentPeriod = 'lunch';

    function switchPeriod(p) {
      currentPeriod = p;
      document.getElementById('btnLunch').className = p === 'lunch' ? 'primary' : '';
      document.getElementById('btnLunch').style.background = p === 'lunch' ? '#111' : '#eee';
      document.getElementById('btnLunch').style.color = p === 'lunch' ? '#fff' : '#333';
      document.getElementById('btnBreakfast').className = p === 'breakfast' ? 'primary' : '';
      document.getElementById('btnBreakfast').style.background = p === 'breakfast' ? '#111' : '#eee';
      document.getElementById('btnBreakfast').style.color = p === 'breakfast' ? '#fff' : '#333';
      loadOrders();
    }
    function fmtTime(t) {
      const d = new Date(t);
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return hh + ':' + mm;
    }

    function loadFeedback() {
      supabaseClient.from('feedback').select('*').eq('approved', true).order('created_at', {ascending: false}).then(function (res) {
        if (res.error) {console.error(res.error); return;}
        const list = res.data || [];
        if (!list.length) {
          document.getElementById('feedbackBox').innerHTML = '<div class="noorders">暂无反馈</div>';
          return;
        }
        let html = '<table><thead><tr><th>时间</th><th>姓名</th><th>内容</th></tr></thead><tbody>';
        list.forEach(function (f) {
          html += '<tr>' +
            '<td>' + fmtTime(f.created_at) + '</td>' +
            '<td>' + escapeHtml(f.name || '') + '</td>' +
            '<td>' + escapeHtml(f.content || '') + '</td>' +
            '</tr>';
        });
        html += '</tbody></table>';
        document.getElementById('feedbackBox').innerHTML = html;
      });
    }
    function getMealDate() {
      const now = new Date();
      const h = now.getHours();
      if (h >= 15) {now.setDate(now.getDate() + 1);}
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }

    function loadOrders() {
      const targetDate = getMealDate();
      supabaseClient.from('orders')
        .select('*')
        .eq('meal_date', targetDate)
        .eq('meal_period', currentPeriod)
        .order('created_at', {ascending: true})
        .then(function (res) {
          if (res.error) {
            document.getElementById('ordersBox').innerHTML =
              '<div class="noorders">读取失败，请稍后重试。</div>';
            return;
          }
          renderOrders(res.data || []);
        });
    }
    function renderOrders(orders) {
      const counts = {};
      let paidCount = 0;
      orders.forEach(function (o) {
        const k = o.meal_type || '未知';
        counts[k] = (counts[k] || 0) + o.quantity;
        if (o.paid) paidCount++;
      });

      let summaryHtml = '';
      Object.keys(counts).forEach(function (k) {
        summaryHtml += '<div><div class="num">' + counts[k] + '</div><div class="lbl">' + k + '</div></div>';
      });
      const totalQty = orders.reduce(function (s, o) {return s + (o.quantity || 0);}, 0);
      summaryHtml += '<div><div class="num">' + totalQty + '</div><div class="lbl">总份数</div></div>';
      summaryHtml += '<div><div class="num">' + paidCount + '</div><div class="lbl">已付款</div></div>';
      document.getElementById('summaryBox').innerHTML = summaryHtml;

      // 下面接着你原来的表格代码（从 if(!orders.length) 开始）
      if (!orders.length) {
        document.getElementById('ordersBox').innerHTML = '<div class="noorders">今天还没有订单</div>';
        return;
      }

      let html = '<table><thead><tr>' +
        '<th>时间</th><th>订单号</th><th>姓名</th><th>类型</th><th>数量</th><th>备注</th>' +
        '</tr></thead><tbody>';

      orders.forEach(function (o) {
        const mealTag = '<span class="tag" style="background:#e3f2fd;color:#1565c0">' + (o.meal_type || '—') + '</span>';
        html += '<tr>' +
          '<td>' + fmtTime(o.created_at) + '</td>' +
          '<td>' + escapeHtml(o.order_code || '') + '</td>' +
          '<td>' + escapeHtml(o.name || '') + '</td>' +
          '<td>' + mealTag + '</td>' +
          '<td>' + o.quantity + '</td>' +
          '<td class="note">' + escapeHtml(o.note || '') + '</td>' +
          '</tr>';
      });
      html += '</tbody></table>';
      document.getElementById('ordersBox').innerHTML = html;
    }
    restoreAdminSession();
    // 每 30 秒自动刷新
    setInterval(function () {
      loadOrders();
      loadFeedback();
    }, 30000);
  </script>
</body>

</html>
