<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YeranFood｜订单</title>
  <style>
    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f7f5f0;
      color: #222
    }

    header {
      background: #111;
      color: #fff;
      padding: 20px;
      text-align: center
    }

    header h1 {
      margin: 0;
      font-size: 26px
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 16px
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px #0000000d
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 12px
    }

    button {
      padding: 12px 24px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer
    }

    button:hover {
      opacity: .85
    }

    .summary {
      display: flex;
      gap: 16px;
      flex-wrap: wrap
    }

    .summary>div {
      flex: 1;
      min-width: 140px;
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 3px 12px #0000000d
    }

    .summary .num {
      font-size: 32px;
      font-weight: 800;
      color: #111
    }

    .summary .lbl {
      font-size: 14px;
      color: #666;
      margin-top: 4px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px #0000000d
    }

    th,
    td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid #eee;
      font-size: 14px
    }

    th {
      background: #fafafa;
      font-weight: 700;
      color: #555
    }

    td.note {
      color: #888;
      font-size: 13px
    }

    .tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700
    }

    .tag.meat {
      background: #ffe4e1;
      color: #c0392b
    }

    .tag.veg {
      background: #e8f5e9;
      color: #2e7d32
    }

    .hidden {
      display: none
    }

    .err {
      color: #c0392b;
      margin-top: 10px
    }

    h2 {
      margin-top: 0
    }

    .noorders {
      text-align: center;
      color: #999;
      padding: 40px
    }
  
    /* ===== 全局 UI 稳定性增强 ===== */
    button, input, textarea, select { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid rgba(26,115,232,.28);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
    @media (max-width: 700px) {
      button { touch-action: manipulation; }
      #bottomNav {
        padding-bottom: max(8px, env(safe-area-inset-bottom));
      }
      .container { padding: 0 10px; margin-top: 12px; }
      .card { padding: 14px; border-radius: 12px; }
      #main > .card { margin-top: 12px; }
      .kitchen-top-actions {
        float:none !important;
        display:grid !important;
        grid-template-columns:1fr 1fr;
        gap:8px;
        width:100%;
        margin:0 0 12px !important;
      }
      .kitchen-top-actions button {
        width:100%;
        min-width:0;
        padding:10px 8px !important;
        font-size:14px !important;
      }
      .period-switch {
        display:flex;
        gap:8px;
        width:100%;
      }
      .period-switch button {
        flex:1;
        margin-left:0 !important;
        width:0;
        padding:12px 8px !important;
      }
      .summary { gap:8px; }
      .summary>div { min-width: calc(50% - 4px); padding:12px 8px; }
      .summary .num { font-size:24px; }
      .kitchen-refresh { min-height:40px; padding:8px 12px !important; }
      .kitchen-table { display:none; }
      .kitchen-cards { display:grid !important; gap:10px; }
    }
    .kitchen-cards { display:none; }
    .kitchen-order {
      border:1px solid #e5e5e5;
      border-radius:12px;
      padding:13px;
      background:#fff;
    }
    .kitchen-order-top {
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
    }
    .kitchen-order-code { font-weight:800; font-size:17px; }
    .kitchen-order-name { font-size:15px; font-weight:700; margin-top:4px; }
    .kitchen-order-meta { color:#777; font-size:13px; margin-top:8px; line-height:1.6; }
    .kitchen-order-note { margin-top:8px; padding:8px 10px; background:#f7f7f7; border-radius:8px; font-size:13px; color:#666; }


  
    /* ===== YeranFood orange-red operations dashboard ===== */
    :root { --yf-accent:#ed4632; --yf-accent-dark:#c92f29; --yf-accent-soft:#fff0e9; --yf-line:#f0dfd8; --yf-ink:#29201e; }
    body { background:radial-gradient(ellipse at 10% 0%,rgba(255,214,192,.35),transparent 28%),#fff8f4; color:var(--yf-ink); -webkit-font-smoothing:antialiased; }
    header { background:linear-gradient(115deg,#b92525,#ed4632 58%,#ff743b); padding:22px 20px; box-shadow:0 8px 24px rgba(185,37,37,.15); }
    header h1 { letter-spacing:-.4px; }
    header h1:before { content:"✦"; color:#ffe1a7; margin-right:9px; }
    .container { max-width:1120px; }
    .card { border:1px solid var(--yf-line); border-radius:18px; box-shadow:0 8px 24px rgba(96,43,27,.055); }
    .card h2 { color:#38221d; letter-spacing:-.3px; }
    button { background:linear-gradient(110deg,#d92f2d,#f04b35 65%,#ff713b); box-shadow:0 4px 12px rgba(205,48,39,.13); transition:transform .14s ease,box-shadow .14s ease,filter .14s ease; }
    button:hover { opacity:1; filter:saturate(1.08); box-shadow:0 7px 16px rgba(205,48,39,.18); }
    button:active { transform:scale(.98); }
    .summary>div { border:1px solid #f1ddd5; border-radius:16px; background:linear-gradient(145deg,#fff,#fff7f2); }
    .summary .num { color:#df3c2e; }
    table { border-radius:14px; border:1px solid var(--yf-line); }
    th { background:#fff0e9; color:#9d392d; }
    td,th { border-bottom-color:#f4e7e1; }
    tbody tr:hover { background:#fff8f4; }
    .tag.meat { background:#ffe2d9; color:#b52d27; }
    input:focus,textarea:focus,select:focus { border-color:#f16a50; outline:none; box-shadow:0 0 0 3px rgba(240,75,53,.11); }
    .kitchen-order { border-color:#f0d9d0; border-radius:15px; box-shadow:0 4px 12px rgba(96,43,27,.04); }
    .kitchen-order-note { background:#fff2eb; color:#8a5145; }
    .noorders { background:#fff8f4; border-radius:14px; }
    @media (max-width:700px) {
      header { padding:18px 14px; }
      .container { padding-left:12px; padding-right:12px; }
      .card { border-radius:16px; }
      .summary>div { min-width:calc(50% - 5px); }
      .summary .num { color:#df3c2e; }
      .kitchen-order { padding:14px; }
    }

    :root {
      color-scheme: light;
      --staff-bg: #f5f5f7;
      --staff-surface: #ffffff;
      --staff-text: #1d1d1f;
      --staff-muted: #6e6e73;
      --staff-line: #e5e5ea;
      --staff-button: #1d1d1f;

      background: var(--staff-bg) !important;

    }

      background: var(--staff-bg) !important;

    }

    }
    input:focus, textarea:focus, select:focus {
      outline: 2px solid #86868b;

    }
    table th { background: #f5f5f7; color: #424245; }

      --admin-bg:#f5f5f7;
      --admin-surface:#fff;
      --admin-ink:#1d1d1f;
      --admin-muted:#6e6e73;

      max-width:1120px;

    #adminLogin input { display:block; margin:10px 0 14px; }
    input, textarea, select {

    }
    input:focus, textarea:focus, select:focus {

    }
    button {
      min-height:40px;

      transition:background .15s ease, transform .15s ease !important;
    }
    button:hover { background:#3a3a3c !important; filter:none !important; box-shadow:none !important; }
    button:active { transform:scale(.985); }
    .period-switch {

    }
    .period-switch button {

    }
    .period-switch button.primary,
    .period-switch button[aria-pressed="true"] {
      background:#fff !important;

    }
    .summary { display:grid !important; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px !important; margin:18px 0; }
    .summary>div {
      min-width:0 !important;
      padding:18px !important;
      text-align:left !important;
      background:#fff !important;
      border:1px solid var(--admin-line) !important;
      border-radius:16px !important;
      box-shadow:none !important;
    }
    .summary .num { color:var(--admin-ink) !important; font-size:30px !important; letter-spacing:-.8px; }
    .summary .lbl { color:var(--admin-muted) !important; font-size:13px !important; }
    table { box-shadow:none !important; border:1px solid var(--admin-line); }
    th { background:#f5f5f7 !important; color:#424245 !important; }
    th,td { padding:13px 12px !important; border-bottom-color:var(--admin-line) !important; }
    tbody tr:hover { background:#f8f8fa !important; }
    .kitchen-order {

    }
    .kitchen-order-code { color:var(--admin-ink); letter-spacing:-.2px; }
    .kitchen-order-meta { color:var(--admin-muted) !important; }
    .kitchen-order-note { background:#f5f5f7 !important; color:#424245 !important; border-radius:10px !important; }
    .noorders { background:transparent !important; color:var(--admin-muted) !important; }
    .kitchen-top-actions { gap:8px !important; }
    #kitchenPushBtn { background:#fff !important; color:var(--admin-ink) !important; border-color:var(--admin-line) !important; }
    #main > .card h2 { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .kitchen-refresh { flex-shrink:0; }
    @media (max-width:800px) {
      .container { margin-top:14px !important; padding:0 14px !important; }

      .summary>div { padding:14px !important; }

      .period-switch button { flex:1; min-width:0; }

<body>

  <header>
    <h1>YeranFood · 订单</h1>
  </header>

  <main class="container">

    <section class="card" id="adminLogin">
      <h2>管理员登录</h2>
      <input type="email" id="adminEmail" placeholder="管理员邮箱" autocomplete="username">
      <input type="password" id="adminPw" placeholder="密码" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')adminLogin()">
      <button onclick="adminLogin()">登录</button>
      <div id="adminLoginMsg" style="margin-top:10px;color:#c0392b"></div>
    </section>


    <!-- 订单页 -->
    <section id="main" style="display:none">
      <div class="kitchen-top-actions" style="float:right;display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;justify-content:flex-end"><button onclick="enableKitchenPush()" id="kitchenPushBtn" style="margin:0">🔔 开启新订单提醒</button><button onclick="adminLogout()" style="margin:0">退出登录</button></div>
      <div class="period-switch" style="margin-bottom:16px">
        <button id="btnLunch" class="primary" onclick="switchPeriod('lunch')">午餐</button>
        <button id="btnBreakfast" onclick="switchPeriod('breakfast')"
          style="margin-left:8px;padding:12px 24px;border:0;border-radius:10px;background:#eee;color:#333;font-size:16px;font-weight:700;cursor:pointer">早餐</button>
        <button id="btnDrink" onclick="switchPeriod('drink')"
          style="margin-left:8px;padding:12px 24px;border:0;border-radius:10px;background:#eee;color:#333;font-size:16px;font-weight:700;cursor:pointer">饮料</button>
      </div>
      <div class="summary" id="summaryBox"></div>

      <div class="card" style="margin-top:16px">
        <h2>订单列表 <button class="kitchen-refresh" onclick="refreshKitchen(this)"
            style="float:right;font-size:13px;padding:4px 10px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;color:#333">🔄 刷新</button></h2>
        <div id="ordersBox">
          <div class="noorders">加载中…</div>
        </div>
      </div>

      <div class="card">
        <h2>意见反馈 <button onclick="loadFeedback()"
            style="float:right;font-size:13px;padding:4px 10px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer">🔄
            刷新</button></h2>
        <div id="feedbackBox">
          <div class="noorders">加载中…</div>
        </div>
      </div>
    </section>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://kbzspuxrwsuxoyozmvjb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_oC0S_vWgBt_X8N4Xu4cG4g_ekhGwKXB';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const KITCHEN_VAPID_PUBLIC_KEY = 'BLHcf3kJydxitQ0-FUC9zLUIrVVfevE58TjcjNqHFCUSfvx2GX0JptQCyzopH5RSxoSmiZYAuJSP7mCURXJdHtU';

    function base64UrlToUint8Array(base64UrlData) {
      const padding = '='.repeat((4 - base64UrlData.length % 4) % 4);
      const base64 = (base64UrlData + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map(ch => ch.charCodeAt(0)));
    }

    async function refreshKitchenPushButton() {
      const btn = document.getElementById('kitchenPushBtn');
      if (!btn) return;
      if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) {
        btn.textContent = '此设备不支持通知';
        btn.disabled = true;
        return;
      }
      try {
        const registration = await navigator.serviceWorker.register('/sw.js');
        const subscription = await registration.pushManager.getSubscription();
        if (subscription && Notification.permission === 'granted') {
          btn.textContent = '🔔 新订单提醒已开启';
        } else if (Notification.permission === 'denied') {
          btn.textContent = '通知已关闭';
        } else {
          btn.textContent = '🔔 开启新订单提醒';
        }
      } catch (err) {
        console.error('检查厨师端通知失败:', err);
      }
    }

    async function enableKitchenPush() {
      const btn = document.getElementById('kitchenPushBtn');
      if (!btn) return;
      try {
        if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) {
          alert('这个设备或浏览器不支持推送通知。');
          return;
        }
        btn.disabled = true;
        btn.textContent = '开启中…';
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          alert('你需要允许浏览器通知权限，厨师端才能收到新订单提醒。');
          await refreshKitchenPushButton();
          return;
        }
        const registration = await navigator.serviceWorker.register('/sw.js');
        const existing = await registration.pushManager.getSubscription();
        const subscription = existing || await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: base64UrlToUint8Array(KITCHEN_VAPID_PUBLIC_KEY)
        });
        const json = subscription.toJSON();
        const endpoint = json.endpoint;
        const p256dh = json.keys && json.keys.p256dh;
        const auth = json.keys && json.keys.auth;
        if (!endpoint || !p256dh || !auth) throw new Error('INVALID_PUSH_SUBSCRIPTION');

        const { error } = await supabaseClient.rpc('save_kitchen_push_subscription', {
          p_endpoint: endpoint,
          p_p256dh: p256dh,
          p_auth: auth
        });
        if (error) throw error;
        btn.textContent = '🔔 新订单提醒已开启';
      } catch (err) {
        console.error('开启厨师端通知失败:', err);
        alert('开启通知失败，请检查浏览器通知权限后重试。');
        await refreshKitchenPushButton();
      } finally {
        btn.disabled = false;
      }
    }

    async function initKitchenPush() {
      await refreshKitchenPushButton();
    }

    async function adminLogin() {
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPw').value;
      const msg = document.getElementById('adminLoginMsg');
      if (!email || !password) {
        msg.textContent = '请输入邮箱和密码';
        return;
      }
      msg.textContent = '登录中…';
      try {
        const {data, error} = await supabaseClient.auth.signInWithPassword({email, password});
        if (error || !data.session) {
          console.error(error);
          msg.textContent = '登录失败，请检查账号或密码';
          return;
        }
        showAdmin();
      } catch (error) {
        console.error('管理员登录请求失败:', error);
        msg.textContent = '网络异常，请检查连接后重试';
      }
    }

    let adminViewReady = false;

    function showAdmin() {
      if (adminViewReady) return;
      adminViewReady = true;

      document.getElementById('adminLogin').style.display = 'none';
      document.getElementById('main').style.display = 'block';
      loadOrders();
      loadFeedback();
      initKitchenPush();
    }

    async function adminLogout() {
      await supabaseClient.auth.signOut();
      location.reload();
    }

    async function restoreAdminSession() {
      const {data} = await supabaseClient.auth.getSession();
      if (data && data.session) showAdmin();
    }

    supabaseClient.auth.onAuthStateChange(function (event, session) {
      if (event === 'SIGNED_IN' && session) showAdmin();
      if (event === 'SIGNED_OUT') location.reload();
    });



    // Frontend hardening: never inject database/user text into HTML without escaping it.
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }


    function safeErrorMessage(error, fallback) {
      console.error(error);
      return fallback || '操作失败，请稍后重试。';
    }

    function setButtonBusy(btn, busy, busyText, normalText) {
      if (!btn) return;
      btn.disabled = !!busy;
      btn.textContent = busy ? busyText : normalText;
    }

    // SECURITY NOTE:
    // The publishable Supabase key is safe to ship in frontend code only when
    // Row Level Security (RLS) policies protect every table/storage action.
    // Never put a Supabase service_role key or a real admin password in this file.




    let currentPeriod = 'lunch';
    let ordersLoadSeq = 0;

    function switchPeriod(p) {
      currentPeriod = p;
      document.getElementById('btnLunch').className = p === 'lunch' ? 'primary' : '';
      document.getElementById('btnLunch').style.background = p === 'lunch' ? '#111' : '#eee';
      document.getElementById('btnLunch').style.color = p === 'lunch' ? '#fff' : '#333';
      document.getElementById('btnBreakfast').className = p === 'breakfast' ? 'primary' : '';
      document.getElementById('btnBreakfast').style.background = p === 'breakfast' ? '#111' : '#eee';
      document.getElementById('btnBreakfast').style.color = p === 'breakfast' ? '#fff' : '#333';
      document.getElementById('btnDrink').className = p === 'drink' ? 'primary' : '';
      document.getElementById('btnDrink').style.background = p === 'drink' ? '#111' : '#eee';
      document.getElementById('btnDrink').style.color = p === 'drink' ? '#fff' : '#333';
      loadOrders();
    }
    function fmtTime(t) {
      const d = new Date(t);
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return hh + ':' + mm;
    }

    function loadFeedback() {
      return supabaseClient.from('feedback').select('*').eq('approved', true).order('created_at', {ascending: false}).then(function (res) {
        if (res.error) {console.error(res.error); return;}
        const list = res.data || [];
        if (!list.length) {
          document.getElementById('feedbackBox').innerHTML = '<div class="noorders">暂无反馈</div>';
          return;
        }
        let html = '<table><thead><tr><th>时间</th><th>姓名</th><th>内容</th></tr></thead><tbody>';
        list.forEach(function (f) {
          html += '<tr>' +
            '<td>' + fmtTime(f.created_at) + '</td>' +
            '<td>' + escapeHtml(f.name || '') + '</td>' +
            '<td>' + escapeHtml(f.content || '') + '</td>' +
            '</tr>';
        });
        html += '</tbody></table>';
        document.getElementById('feedbackBox').innerHTML = html;
      });
    }
    function getMealDate() {
      const now = new Date();
      const h = now.getHours();
      if (h >= 15) {now.setDate(now.getDate() + 1);}
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }

    function refreshKitchen(btn) {
      if (btn) {
        btn.disabled = true;
        btn.textContent = '刷新中…';
      }
      Promise.all([loadOrders(), loadFeedback()]).finally(function () {
        if (btn) {
          btn.disabled = false;
          btn.textContent = '🔄 刷新';
        }
      });
    }

    function loadOrders() {
      const loadSeq = ++ordersLoadSeq;
      const targetDate = getMealDate();
      return supabaseClient.from('orders')
        .select('*')
        .eq('meal_date', targetDate)
        .eq('meal_period', currentPeriod)
        .order('created_at', {ascending: true})
        .then(function (res) {
          if (loadSeq !== ordersLoadSeq) return;
          if (res.error) {
            document.getElementById('ordersBox').innerHTML =
              '<div class="noorders">读取失败，请稍后重试。</div>';
            return;
          }
          renderOrders(res.data || []);
        });
    }
    let currentOrders = [];

    function renderOrders(orders) {
      currentOrders = (orders || []).slice().sort(function (a, b) {
        return new Date(b.created_at) - new Date(a.created_at);
      });
      const counts = {};
      let paidCount = 0;
      currentOrders.forEach(function (o) {
        const k = o.meal_type || '未知';
        counts[k] = (counts[k] || 0) + Number(o.quantity || 0);
        if (o.paid) paidCount++;
      });
      let summaryHtml = '';
      Object.keys(counts).forEach(function (k) {
        summaryHtml += '<div><div class="num">' + counts[k] + '</div><div class="lbl">' + escapeHtml(k) + '</div></div>';
      });
      const totalQty = currentOrders.reduce(function (s, o) { return s + Number(o.quantity || 0); }, 0);
      summaryHtml += '<div><div class="num">' + totalQty + '</div><div class="lbl">总份数</div></div>';
      summaryHtml += '<div><div class="num">' + paidCount + '</div><div class="lbl">已付款订单</div></div>';
      document.getElementById('summaryBox').innerHTML = summaryHtml;
      renderOrderRows(currentOrders);
    }

    function renderOrderRows(orders) {
      if (!orders.length) {
        document.getElementById('ordersBox').innerHTML = '<div class="noorders">今天还没有订单</div>';
        return;
      }
      let html = '<div class="kitchen-table"><table><thead><tr>' +
        '<th>时间</th><th>订单号</th><th>姓名</th><th>类型</th><th>数量</th><th>付款</th><th>备注</th>' +
        '</tr></thead><tbody>';
      orders.forEach(function (o) {
        const mealTag = '<span class="tag">' + escapeHtml(o.meal_type || '—') + '</span>';
        const paidTag = o.paid
          ? '<span class="payment-pill is-paid">已付款</span>'
          : '<span class="payment-pill is-unpaid">未付款</span>';
        html += '<tr>' +
          '<td>' + fmtTime(o.created_at) + '</td>' +
          '<td><strong>' + escapeHtml(o.order_code || '—') + '</strong></td>' +
          '<td>' + escapeHtml(o.name || '未填写姓名') + '</td>' +
          '<td>' + mealTag + '</td>' +
          '<td><strong>' + Number(o.quantity || 0) + '</strong></td>' +
          '<td>' + paidTag + '</td>' +
          '<td class="note">' + escapeHtml(o.note || '—') + '</td>' +
          '</tr>';
      });
      html += '</tbody></table></div><div class="kitchen-cards">';
      orders.forEach(function (o) {
        const note = String(o.note || '').trim();
        html += '<div class="kitchen-order">' +
          '<div class="kitchen-order-top"><div><div class="kitchen-order-code">' + escapeHtml(o.order_code || '—') + '</div>' +
          '<div class="kitchen-order-name">' + escapeHtml(o.name || '未填写姓名') + '</div></div>' +
          '<span class="payment-pill ' + (o.paid ? 'is-paid' : 'is-unpaid') + '">' + (o.paid ? '已付款' : '未付款') + '</span></div>' +
          '<div class="kitchen-order-meta">' + fmtTime(o.created_at) + ' · ' + escapeHtml(o.meal_type || '—') + ' · <strong>' + Number(o.quantity || 0) + ' 份</strong></div>' +
          (note ? '<div class="kitchen-order-note">备注：' + escapeHtml(note) + '</div>' : '') +
          '</div>';
      });
      html += '</div>';
      document.getElementById('ordersBox').innerHTML = html;
    }
    restoreAdminSession();
    // 每 30 秒自动刷新
    setInterval(function () {
      loadOrders();
      loadFeedback();
    }, 30000);
  </script>
</body>

</html>
