<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YeranFood · 我的订单</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #fafafa;
      color: #111;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 70px
    }

    header {
      background: #111;
      color: #fff;
      padding: 24px 20px;
      text-align: center;
      position: relative
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 1.5px;
      font-weight: 800
    }

    header p {
      margin: 6px 0 0;
      color: #999;
      font-size: 13px
    }

    .back {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 0;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      padding: 8px
    }

    .container {
      max-width: 620px;
      margin: 24px auto;
      padding: 0 16px
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 28px 24px;
      margin-bottom: 18px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .06);
      border: 1px solid #f0f0f0;
      animation: fadeIn .4s ease
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    h2 {
      margin: 0 0 16px;
      font-size: 18px;
      font-weight: 800
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1.5px solid #e5e5e5;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      transition: border-color .2s;
      background: #fafafa
    }

    input:focus {
      outline: none;
      border-color: #111;
      background: #fff
    }

    button.primary {
      width: 100%;
      margin-top: 14px;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      font-family: inherit
    }

    button.primary:hover {
      background: #000;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, .2)
    }

    button.primary:active {
      transform: translateY(0)
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 15px
    }

    .row:last-child {
      border-bottom: 0
    }

    .row .label {
      color: #888
    }

    .row .value {
      font-weight: 600;
      color: #111;
      text-align: right
    }

    .orderCard {
      margin-bottom: 14px;
      padding: 18px;
      background: #fafafa;
      border-radius: 14px;
      border: 1px solid #f0f0f0
    }

    .orderCard .oid {
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 8px
    }

    .tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      margin-left: 6px
    }

    .tag.paid {
      background: #e8f5e9;
      color: #2e7d32
    }

    .tag.unpaid {
      background: #fff3e0;
      color: #e65100
    }

    .tag.cash {
      background: #fff8e1;
      color: #ef6c00
    }

    .tag.online {
      background: #e3f2fd;
      color: #1565c0
    }

    .noorders {
      text-align: center;
      color: #999;
      padding: 30px;
      font-size: 14px
    }

    footer {
      text-align: center;
      color: #888;
      padding: 20px;
      font-size: 13px
    }

    .langToggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 1.5px solid #444;
      color: #fff;
      border-radius: 20px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit
    }

    .langToggle:hover {
      border-color: #fff
    }

    #bottomNav {
      display: none
    }

    @media (max-width:640px) {
      #bottomNav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #fff;
        border-top: 1px solid #eee;
        justify-content: space-around;
        padding: 8px 0;
        z-index: 100;
        box-shadow: 0 -2px 12px rgba(0, 0, 0, .04)
      }

      .navBtn {
        background: transparent;
        border: 0;
        color: #999;
        cursor: pointer;
        padding: 6px 20px;
        font-family: inherit;
        transition: color .2s
      }

      .navBtn.active {
        color: #111
      }
    }

    body.dark {
      background: #343a43;
      color: #eee
    }

    body.dark .card {
      background: #3b424c;
      border-color: #2a2a2a
    }

    body.dark .orderCard {
      background: #3b424c;
      border-color: #2a2a2a
    }

    body.dark input {
      background: #222;
      border-color: #333;
      color: #eee
    }

    body.dark input:focus {
      border-color: #fff;
      background: #2a2a2a
    }

    body.dark .row {
      border-bottom-color: #2a2a2a
    }

    body.dark .row .label {
      color: #666
    }

    body.dark .row .value {
      color: #eee
    }

    body.dark #bottomNav {
      background: #1a1a1a;
      border-top-color: #2a2a2a
    }

    body.dark .navBtn.active {
      color: #fff
    }
  
    /* ===== 全局 UI 稳定性增强 ===== */
    button, input, textarea, select { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid rgba(26,115,232,.28);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
    @media (max-width: 700px) {
      button { touch-action: manipulation; }
      #bottomNav {
        padding-bottom: max(8px, env(safe-area-inset-bottom));
      }
    }

  
    /* ===== YeranFood customer order lookup visual refresh ===== */
    :root { --yf-red:#e64431; --yf-red-dark:#bd2927; --yf-line:#f0dfd8; }
    body { background:radial-gradient(ellipse at 8% 0%,rgba(255,214,192,.35),transparent 30%),#fff8f4; color:#29201e; }
    header { background:linear-gradient(115deg,#b92525,#ed4632 58%,#ff743b); padding:25px 20px; box-shadow:0 10px 26px rgba(185,37,37,.15); }
    header h1 { letter-spacing:-.4px; }
    header h1:before { content:"✦"; color:#ffe1a7; margin-right:9px; }
    header p { color:rgba(255,255,255,.82); }
    .card,.orderCard { border-color:var(--yf-line); box-shadow:0 8px 24px rgba(96,43,27,.05); }
    h2 { color:#38221d; }
    input:focus { border-color:#f16a50; box-shadow:0 0 0 3px rgba(240,75,53,.11); }
    button.primary { background:linear-gradient(110deg,#d92f2d,#f04b35 65%,#ff713b); box-shadow:0 8px 18px rgba(205,48,39,.17); }
    button.primary:hover { background:linear-gradient(110deg,#bd2427,#e63e30 65%,#f65e30); }
    .row .value { color:#38221d; }
    .tag.paid { background:#e6f6eb; color:#247344; }
    .tag.unpaid { background:#ffe4dd; color:#b92f29; }
    .tag.cash { background:#fff2d7; color:#925b13; }
    .tag.online { background:#fff0e9; color:#bd3c2e; }
    #bottomNav { border-top-color:#f1ddd5; box-shadow:0 -6px 22px rgba(96,43,27,.07); }
    .navBtn.active { color:#e64431; }
    @media(max-width:640px) {
      header { padding:24px 12px; border-radius:0 0 22px 22px; }
      header h1 { font-size:22px; }
      .back { left:8px; }
      .langToggle { right:8px; }
      .container { margin-top:16px; padding:0 12px; }
      .card { padding:21px 16px; border-radius:18px; }
      .orderCard { padding:15px; border-radius:14px; overflow-wrap:anywhere; }
      #bottomNav { padding-bottom:max(8px,env(safe-area-inset-bottom)); }
    }

  
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --yf-line:#454c57; }
      body { background:#24282e !important; color:#f3f4f6 !important; }
      header { background:#2d323a !important; color:#f8fafc !important; border-bottom:1px solid #30343d; }
      .card, #orderCard, #adminLogin, #loginCard, #main > .card, .order-card,
      .orderCard, .panel, .modal, .modal-content {
        background:#343a43 !important; color:#f3f4f6 !important;
        border-color:#4a515d !important; box-shadow:0 8px 24px rgba(0,0,0,.2);
      }
      .row { border-bottom-color:#454c57 !important; }
      .row .label, p, small, .muted, .hint { color:#c0c5ce !important; }
      .row .value { color:#f3f4f6 !important; }
      input, select, textarea {
        background:#3b424c !important; color:#f3f4f6 !important; border-color:#555e6b !important;
      }
      input::placeholder, textarea::placeholder { color:#a0a7b2 !important; }
      input:focus, select:focus, textarea:focus { border-color:#f28b63 !important; box-shadow:0 0 0 3px rgba(242,139,99,.16) !important; }
      #bottomNav { background:#2d323a !important; border-top-color:#454c57 !important; }
      .navBtn { color:#c0c5ce !important; }
      .navBtn.active { color:#ffad88 !important; background:#38261f !important; }
      .tag.paid { background:#173b2b !important; color:#86efac !important; border-color:#286747 !important; }
      .tag.unpaid { background:#42251f !important; color:#ffb4a1 !important; border-color:#794235 !important; }
      .tag.cash, .tag.online { background:#3b424c !important; color:#d7dbe3 !important; border-color:#555e6b !important; }
      button.primary { color:#fff !important; }
      a { color:#ffad88; }
    }
  </style>
  <link rel="stylesheet" href="/animations.css">

  <style id="yf-unified-visual-system">

  /* YeranFood unified B palette: minimal white + electric violet */
  :root {
    --yf-primary: #6558F5;
    --yf-primary-hover: #5547E8;
    --yf-primary-soft: #EFEDFF;
    --yf-page: #F7F8FC;
    --yf-surface: #FFFFFF;
    --yf-text: #20212A;
    --yf-muted: #737789;
    --yf-border: #E7E8F0;
    --yf-shadow: 0 6px 24px rgba(32, 33, 42, .055);
    --yf-shadow-hover: 0 10px 28px rgba(32, 33, 42, .09);
    --yf-radius: 16px;
    --yf-motion: 180ms cubic-bezier(.2,.7,.2,1);
  }
  html { scroll-behavior: smooth; }
  body:not(.dark) {
    background: var(--yf-page) !important;
    color: var(--yf-text) !important;
    -webkit-font-smoothing: antialiased;
  }
  body:not(.dark) header {
    background: rgba(255,255,255,.96) !important;
    color: var(--yf-text) !important;
    border-bottom: 1px solid var(--yf-border);
    box-shadow: 0 2px 12px rgba(32,33,42,.025);
  }
  body:not(.dark) header h1,
  body:not(.dark) header h2,
  body:not(.dark) header p { color: inherit; }
  body:not(.dark) .card,
  body:not(.dark) #orderCard,
  body:not(.dark) #adminLogin,
  body:not(.dark) #loginCard,
  body:not(.dark) #main > .card,
  body:not(.dark) .order-card,
  body:not(.dark) .kitchen-order,
  body:not(.dark) .menu-product-card,
  body:not(.dark) .option-card,
  body:not(.dark) .yf-product-card,
  body:not(.dark) .stat-card,
  body:not(.dark) .panel {
    border-color: var(--yf-border);
    border-radius: var(--yf-radius);
    box-shadow: var(--yf-shadow);
  }
  button, input, select, textarea, a,
  .card, .order-card, .kitchen-order, .option-card, .yf-product-card {
    transition: background-color var(--yf-motion), color var(--yf-motion),
      border-color var(--yf-motion), box-shadow var(--yf-motion), transform var(--yf-motion);
  }
  button {
    border-radius: 12px;
    font-weight: 600;
    -webkit-tap-highlight-color: transparent;
  }
  button:focus-visible, a:focus-visible, input:focus-visible,
  select:focus-visible, textarea:focus-visible {
    outline: 3px solid rgba(101,88,245,.28);
    outline-offset: 2px;
  }
  body:not(.dark) input:not([type="checkbox"]):not([type="radio"]),
  body:not(.dark) select,
  body:not(.dark) textarea {
    border-color: var(--yf-border);
    border-radius: 12px;
    background-color: #fff;
    color: var(--yf-text);
  }
  body:not(.dark) input:focus,
  body:not(.dark) select:focus,
  body:not(.dark) textarea:focus {
    border-color: var(--yf-primary);
    box-shadow: 0 0 0 3px rgba(101,88,245,.12);
    outline: none;
  }
  body:not(.dark) a:not([class*="danger"]) { text-underline-offset: 3px; }
  button:active { transform: scale(.985); }
  @media (hover: hover) {
    body:not(.dark) .card:hover,
    body:not(.dark) .order-card:hover,
    body:not(.dark) .kitchen-order:hover,
    body:not(.dark) .option-card:hover,
    body:not(.dark) .yf-product-card:hover {
      box-shadow: var(--yf-shadow-hover);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: .01ms !important;
    }
  }


  body:not(.dark) button.primary {
    background: linear-gradient(110deg, #6558F5, #786CFF) !important;
    border-color: #6558F5 !important;
    box-shadow: 0 7px 18px rgba(101,88,245,.18);
  }
  body:not(.dark) button.primary:hover { background: #5547E8 !important; }
  body:not(.dark) .navBtn.active {
    color: var(--yf-primary) !important;
    background: var(--yf-primary-soft) !important;
    border-color: transparent !important;
  }
  body:not(.dark) .back,
  body:not(.dark) .langToggle { color: var(--yf-text); }

  </style>

  <!-- Final dark-mode palette: slate surfaces, never pure black -->
  <!-- Dark mode only: preserve existing light-mode appearance -->
  <style id="yf-dark-mode-final-fix">
    :root {
      --yf-dark-page: #303640;
      --yf-dark-header: #39414d;
      --yf-dark-surface: #3b4450;
      --yf-dark-raised: #444e5b;
      --yf-dark-border: #535f6e;
      --yf-dark-text: #f3f5f8;
      --yf-dark-muted: #c0c8d2;
      --yf-dark-accent: #ffb18f;
      --yf-dark-accent-bg: #514039;
    }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; }
      html, body {
        background: var(--yf-dark-page) !important;
        background-image: none !important;
        color: var(--yf-dark-text) !important;
      }
      header {
        background: var(--yf-dark-header) !important;
        background-image: none !important;
        color: var(--yf-dark-text) !important;
        border-color: var(--yf-dark-border) !important;
        box-shadow: 0 3px 14px rgba(0,0,0,.12) !important;
      }
      .card, .payBox, .total, .product-card, .menu-card, .modal-content,
      .modal, .dialog, .opt label, .qty, .feedbackBtn, .order-card,
      .orderCard, .panel, .breakfast-product-card, .breakfast-option,
      .breakfast-qty, #feedbackListModal > div, #orderCard, #payCard,
      #successCard, #main > .card, #adminLogin, #loginCard,
      #productList > button.yf-product-card {
        background: var(--yf-dark-surface) !important;
        background-image: none !important;
        color: var(--yf-dark-text) !important;
        border-color: var(--yf-dark-border) !important;
        box-shadow: 0 5px 16px rgba(0,0,0,.10) !important;
      }
      input:not([type="checkbox"]):not([type="radio"]), textarea, select {
        background: var(--yf-dark-raised) !important;
        color: var(--yf-dark-text) !important;
        border-color: var(--yf-dark-border) !important;
      }
      input::placeholder, textarea::placeholder { color: #b5bfcb !important; }
      input:focus, textarea:focus, select:focus {
        border-color: var(--yf-dark-accent) !important;
        box-shadow: 0 0 0 3px rgba(255,177,143,.15) !important;
      }
      h1, h2, h3, label, .food h2, .yf-product-name, .breakfast-product-name,
      .breakfast-choice-title, .breakfast-option-name, .row .value, .total,
      .total strong, .price, .qty, .qty button {
        color: var(--yf-dark-text) !important;
      }
      p, small, footer, .muted, .hint, #menuTitle, #foodDesc,
      .breakfast-product-desc, .breakfast-option-desc, .breakfast-qty-title,
      .row .label, .fileName, .noorders {
        color: var(--yf-dark-muted) !important;
      }
      .food, .row, .breakfast-qty { border-color: var(--yf-dark-border) !important; }
      .opt label:has(input:checked), .breakfast-option:has(input:checked),
      .periodBtn.active, #productList > button.yf-product-card.yf-selected {
        background: var(--yf-dark-accent-bg) !important;
        color: #fff2eb !important;
        border-color: var(--yf-dark-accent) !important;
        box-shadow: none !important;
      }
      .periodBtn {
        background: var(--yf-dark-surface) !important;
        color: var(--yf-dark-text) !important;
        border-color: var(--yf-dark-border) !important;
      }
      .qty button, .feedbackBtn, #feedbackListModal button {
        background: var(--yf-dark-raised) !important;
        color: var(--yf-dark-text) !important;
        border-color: var(--yf-dark-border) !important;
      }
      #bottomNav, .checkoutBar {
        background: var(--yf-dark-header) !important;
        border-color: var(--yf-dark-border) !important;
      }
      .navBtn { color: var(--yf-dark-muted) !important; }
      .navBtn.active {
        color: var(--yf-dark-accent) !important;
        background: var(--yf-dark-accent-bg) !important;
      }
      .tag.paid { background: #244b39 !important; color: #adf0c7 !important; border-color: #397456 !important; }
      .tag.unpaid { background: #55372f !important; color: #ffc4b2 !important; border-color: #815448 !important; }
      .tag.cash, .tag.online { background: var(--yf-dark-raised) !important; color: #e3e9f0 !important; border-color: var(--yf-dark-border) !important; }
      .breakfast-badge { background: #51452e !important; color: #ffdfa0 !important; }
      .skeleton { background: linear-gradient(90deg,#3b4450 25%,#485361 50%,#3b4450 75%) !important; }
      a { color: var(--yf-dark-accent) !important; }
      button.primary, .submit, .uploadBtn {
        background: #d94d3d !important;
        color: #fff !important;
        border-color: #d94d3d !important;
      }
    }
    body.dark {
      color-scheme: dark;
      background: var(--yf-dark-page) !important;
      background-image: none !important;
      color: var(--yf-dark-text) !important;
    }
    body.dark header {
      background: var(--yf-dark-header) !important;
      background-image: none !important;
      color: var(--yf-dark-text) !important;
      border-color: var(--yf-dark-border) !important;
    }
    body.dark .card, body.dark .payBox, body.dark .product-card,
    body.dark .menu-card, body.dark .modal-content, body.dark .modal,
    body.dark .dialog, body.dark .opt label, body.dark .order-card,
    body.dark .orderCard, body.dark .panel, body.dark .breakfast-product-card,
    body.dark .breakfast-option, body.dark #orderCard, body.dark #payCard,
    body.dark #successCard, body.dark #productList > button.yf-product-card {
      background: var(--yf-dark-surface) !important;
      background-image: none !important;
      color: var(--yf-dark-text) !important;
      border-color: var(--yf-dark-border) !important;
    }
    body.dark input:not([type="checkbox"]):not([type="radio"]),
    body.dark textarea, body.dark select {
      background: var(--yf-dark-raised) !important;
      color: var(--yf-dark-text) !important;
      border-color: var(--yf-dark-border) !important;
    }
    body.dark p, body.dark small, body.dark footer, body.dark .muted,
    body.dark .hint, body.dark #menuTitle, body.dark #foodDesc,
    body.dark .breakfast-product-desc, body.dark .breakfast-option-desc,
    body.dark .row .label, body.dark .fileName, body.dark .noorders {
      color: var(--yf-dark-muted) !important;
    }
    body.dark .opt label:has(input:checked),
    body.dark .breakfast-option:has(input:checked),
    body.dark .periodBtn.active,
    body.dark #productList > button.yf-product-card.yf-selected {
      background: var(--yf-dark-accent-bg) !important;
      color: #fff2eb !important;
      border-color: var(--yf-dark-accent) !important;
    }
    body.dark #bottomNav, body.dark .checkoutBar {
      background: var(--yf-dark-header) !important;
      border-color: var(--yf-dark-border) !important;
    }
    body.dark .navBtn { color: var(--yf-dark-muted) !important; }
    body.dark .navBtn.active { color: var(--yf-dark-accent) !important; background: var(--yf-dark-accent-bg) !important; }
  </style>

</head>

<body>

  <header>
    <button class="back" onclick="location.href='/'">←</button>
    <h1 id="pageTitle">我的订单</h1>
    <p id="pageSub">My Orders</p>
    <button class="langToggle" id="langBtn" onclick="toggleLang()">EN</button>
  </header>

  <main class="container">

    <div class="card">
      <h2 id="searchTitle">查订单</h2>
      <input id="codeInput" onkeydown="if(event.key==='Enter')search()">
      <button class="primary" id="searchBtn" onclick="search()">查询</button>
    </div>

    <div id="resultBox"></div>

  </main>

  <nav id="bottomNav">
    <button class="navBtn" onclick="location.href='/'">
      <div style="font-size:20px">🍱</div>
      <div style="font-size:11px;margin-top:2px" id="navOrder">点餐</div>
    </button>
    <button class="navBtn active" onclick="location.href='/orders.html'">
      <div style="font-size:20px">📋</div>
      <div style="font-size:11px;margin-top:2px" id="navMyOrder">订单</div>
    </button>
    <button class="navBtn" onclick="location.href='/'">
      <div style="font-size:20px">💬</div>
      <div style="font-size:11px;margin-top:2px" id="navFeedback">反馈</div>
    </button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://kbzspuxrwsuxoyozmvjb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_oC0S_vWgBt_X8N4Xu4cG4g_ekhGwKXB';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Frontend hardening: never inject database/user text into HTML without escaping it.
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    

    function safeErrorMessage(error, fallback) {
      console.error(error);
      return fallback || '操作失败，请稍后重试。';
    }

    function setButtonBusy(btn, busy, busyText, normalText) {
      if (!btn) return;
      btn.disabled = !!busy;
      btn.textContent = busy ? busyText : normalText;
    }
    
    // SECURITY NOTE:
    // The publishable Supabase key is safe to ship in frontend code only when
    // Row Level Security (RLS) policies protect every table/storage action.
    // Never put a Supabase service_role key or a real admin password in this file.
    

    let lang = localStorage.getItem('lang') || 'zh';

    const text = {
      zh: {
        pageTitle: '我的订单',
        pageSub: 'My Orders',
        searchTitle: '查订单',
        inputPh: '输入订单号（如 YF-123456）',
        searchBtn: '查询',
        searchEmpty: '请输入订单号',
        searching: '查询中…',
        notFound: '没找到这个订单号',
        queryFail: '查询失败：',
        labelTime: '时间',
        labelName: '姓名',
        labelOption: '选项',
        labelQty: '数量',
        labelTotal: '金额',
        labelPayment: '付款',
        labelNote: '备注',
        tagPaid: '已付款',
        tagUnpaid: '待确认',
        tagCash: '现金',
        tagOnline: '线上',
        navOrder: '点餐',
        navMyOrder: '订单',
        navFeedback: '反馈',
        langBtn: 'EN'
      },
      en: {
        pageTitle: 'My Orders',
        pageSub: '',
        searchTitle: 'Search Order',
        inputPh: 'Order code (e.g. YF-123456)',
        searchBtn: 'Search',
        searchEmpty: 'Please enter order code',
        searching: 'Searching…',
        notFound: 'Order not found',
        queryFail: 'Error: ',
        labelTime: 'Time',
        labelName: 'Name',
        labelOption: 'Option',
        labelQty: 'Qty',
        labelTotal: 'Total',
        labelPayment: 'Payment',
        labelNote: 'Note',
        tagPaid: 'Paid',
        tagUnpaid: 'Pending',
        tagCash: 'Cash',
        tagOnline: 'Online',
        navOrder: 'Order',
        navMyOrder: 'My Orders',
        navFeedback: 'Feedback',
        langBtn: '中'
      }
    };

    function applyLang() {
      const t = text[lang];
      document.getElementById('pageTitle').textContent = t.pageTitle;
      document.getElementById('pageSub').textContent = t.pageSub;
      document.getElementById('searchTitle').textContent = t.searchTitle;
      document.getElementById('codeInput').placeholder = t.inputPh;
      document.getElementById('searchBtn').textContent = t.searchBtn;
      document.getElementById('navOrder').textContent = t.navOrder;
      document.getElementById('navMyOrder').textContent = t.navMyOrder;
      document.getElementById('navFeedback').textContent = t.navFeedback;
      document.getElementById('langBtn').textContent = t.langBtn;
    }

    function toggleLang() {
      lang = lang === 'zh' ? 'en' : 'zh';
      localStorage.setItem('lang', lang);
      applyLang();
      const lastCode = document.getElementById('codeInput').value.trim();
      if (lastCode) search();
    }

    function fmtTime(t) {
      const d = new Date(t);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const mi = String(d.getMinutes()).padStart(2, '0');
      return mm + '-' + dd + ' ' + hh + ':' + mi;
    }

    let searchRequestSeq = 0;

    async function search() {
      const t = text[lang];
      const code = document.getElementById('codeInput').value.trim().toUpperCase();
      const box = document.getElementById('resultBox');
      const btn = document.getElementById('searchBtn');
      const requestSeq = ++searchRequestSeq;

      if (code) sessionStorage.setItem('lastOrderCode', code);
      if (!code) {
        box.innerHTML = '<div class="card noorders">' + t.searchEmpty + '</div>';
        return;
      }

      btn.disabled = true;
      btn.textContent = t.searching;
      box.innerHTML = '<div class="card noorders">' + t.searching + '</div>';

      try {
        const res = await supabaseClient.rpc('get_order_by_code', { p_order_code: code });
        // 忽略较早发出的查询，防止旧结果覆盖最新输入。
        if (requestSeq !== searchRequestSeq) return;

        if (res.error) {
          console.error(res.error);
          box.innerHTML = '<div class="card noorders">' + t.queryFail + (lang === 'zh' ? '请检查网络后重试。' : ' Please check your connection and try again.') + '</div>';
          return;
        }
        if (!res.data || !res.data.length) {
          box.innerHTML = '<div class="card noorders">' + t.notFound + '</div>';
          return;
        }

        const o = res.data[0];
        const statusTag = o.paid
          ? '<span class="tag paid">' + t.tagPaid + '</span>'
          : '<span class="tag unpaid">' + t.tagUnpaid + '</span>';
        const payTag = o.payment_method === 'cash'
          ? '<span class="tag cash">' + t.tagCash + '</span>'
          : '<span class="tag online">' + t.tagOnline + '</span>';

        const html = '<div class="card">' +
          '<div class="orderCard">' +
          '<div class="oid">' + escapeHtml(o.order_code || '') + ' ' + statusTag + '</div>' +
          '<div class="row"><span class="label">' + t.labelTime + '</span><span class="value">' + fmtTime(o.created_at) + '</span></div>' +
          '<div class="row"><span class="label">' + t.labelName + '</span><span class="value">' + escapeHtml(o.name || '') + '</span></div>' +
          '<div class="row"><span class="label">' + t.labelOption + '</span><span class="value">' + escapeHtml(o.meal_type || '') + '</span></div>' +
          '<div class="row"><span class="label">' + t.labelQty + '</span><span class="value">' + Number(o.quantity || 0) + '</span></div>' +
          '<div class="row"><span class="label">' + t.labelTotal + '</span><span class="value">RM ' + Number(o.total || 0).toFixed(2) + '</span></div>' +
          '<div class="row"><span class="label">' + t.labelPayment + '</span><span class="value">' + payTag + '</span></div>' +
          (o.note ? '<div class="row"><span class="label">' + t.labelNote + '</span><span class="value">' + escapeHtml(o.note) + '</span></div>' : '') +
          '</div>' +
          '</div>';
        box.innerHTML = html;
      } catch (err) {
        if (requestSeq !== searchRequestSeq) return;
        console.error(err);
        box.innerHTML = '<div class="card noorders">' + t.queryFail + (lang === 'zh' ? '请检查网络后重试。' : ' Please check your connection and try again.') + '</div>';
      } finally {
        if (requestSeq === searchRequestSeq) {
          btn.disabled = false;
          btn.textContent = t.searchBtn;
        }
      }
    }

    // 恢复深色模式
    if (localStorage.getItem('darkMode') === '1') {
      document.body.classList.add('dark');
    }

    // 初始化
    applyLang();
  </script>
</body>

</html>
